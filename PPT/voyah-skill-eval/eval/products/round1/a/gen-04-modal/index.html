<!DOCTYPE html>
<html lang="zh-CN" data-vx-theme="blue">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>删除确认弹窗 · Voyah UI Demo</title>
<link rel="stylesheet" href="./tokens.css" />
<style>
  /* ---------- 页面布局 ---------- */
  .page {
    min-height: 100vh;
    background: var(--vx-bg-layout);
    padding: var(--vx-padding-page);
  }
  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: var(--vx-space-4);
  }
  .page-title {
    font-size: var(--vx-font-size-xl);
    line-height: var(--vx-line-height-page-title);
    font-weight: var(--vx-font-weight-bold);
    color: var(--vx-text-title);
  }

  /* 列表卡片 */
  .list-card {
    background: var(--vx-bg-base);
    border: 1px solid var(--vx-line-1);
    border-radius: var(--vx-radius-lg);
    overflow: hidden;
  }
  .list-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--vx-space-4);
    border-bottom: 1px solid var(--vx-line-1);
  }
  .list-toolbar-title {
    font-size: var(--vx-font-size-lg);
    line-height: var(--vx-line-height-module-title);
    font-weight: var(--vx-font-weight-bold);
    color: var(--vx-text-title);
  }
  .list-table {
    width: 100%;
    border-collapse: collapse;
    font-size: var(--vx-font-size-md);
    color: var(--vx-text-primary);
  }
  .list-table th,
  .list-table td {
    padding: var(--vx-space-3) var(--vx-space-4);
    text-align: left;
    border-bottom: 1px solid var(--vx-line-1);
    line-height: var(--vx-line-height-body);
  }
  .list-table th {
    background: var(--vx-fill-1);
    font-weight: var(--vx-font-weight-medium);
    color: var(--vx-text-secondary);
    font-size: var(--vx-font-size-xs);
  }
  .list-table tr:last-child td {
    border-bottom: none;
  }
  .row-actions {
    display: inline-flex;
    gap: var(--vx-space-4);
  }
  .row-action-link {
    font-size: var(--vx-font-size-md);
    color: var(--vx-primary);
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
    font-family: inherit;
  }
  .row-action-link:hover { color: var(--vx-primary-hover); }
  .row-action-link:active { color: var(--vx-primary-active); }
  .row-action-link.danger { color: var(--vx-error); }
  .row-action-link.danger:hover { color: var(--vx-btn-danger-hover); }
  .row-action-link.danger:active { color: var(--vx-error-dark); }

  /* ---------- 遮罩层 ---------- */
  .modal-mask {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }

  /* ---------- 弹窗 ---------- */
  .vx-modal {
    width: 480px;
    background: var(--vx-bg-base);
    border-radius: var(--vx-radius-lg);
    box-shadow: var(--vx-shadow-modal);
    padding: var(--vx-padding-modal);
    display: flex;
    flex-direction: column;
    gap: var(--vx-space-4);
  }
  .vx-modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .vx-modal-title {
    font-size: var(--vx-font-size-lg);
    line-height: var(--vx-line-height-module-title);
    font-weight: var(--vx-font-weight-bold);
    color: var(--vx-text-title);
  }
  .vx-modal-close {
    width: 24px;
    height: 24px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--vx-text-secondary);
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
    font-size: var(--vx-font-size-lg);
    line-height: 1;
  }
  .vx-modal-close:hover { color: var(--vx-text-primary); }

  .vx-modal-body {
    display: flex;
    flex-direction: column;
    gap: var(--vx-space-4);
  }
  .modal-desc {
    font-size: var(--vx-font-size-md);
    line-height: var(--vx-line-height-body);
    color: var(--vx-text-primary);
  }

  /* 单选项组 */
  .vx-radio-group {
    display: flex;
    flex-direction: column;
    gap: var(--vx-space-3);
  }
  .vx-radio-group .vx-radio {
    height: 24px;
    font-size: var(--vx-font-size-md);
  }

  /* 弹窗底部按钮区 */
  .vx-modal-footer {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: var(--vx-space-2);
    padding-top: var(--vx-space-4);
    border-top: 1px solid var(--vx-line-1);
  }
  /* 规范：主按钮在左，次按钮在右（按钮组内从左到右：主 → 次） */
  .vx-modal-footer .vx-btn-primary { order: 1; }
  .vx-modal-footer .vx-btn-secondary { order: 2; }

  /* ---------- 按钮类型对照区（弹窗下方） ---------- */
  .demo-section {
    margin-top: var(--vx-space-6);
    width: 480px;
    margin-left: auto;
    margin-right: auto;
  }
  .demo-section-title {
    font-size: var(--vx-font-size-lg);
    line-height: var(--vx-line-height-module-title);
    font-weight: var(--vx-font-weight-bold);
    color: var(--vx-text-title);
    margin-bottom: var(--vx-space-3);
  }
  .btn-legend {
    display: grid;
    grid-template-columns: 80px 1fr 1fr;
    gap: var(--vx-space-2) var(--vx-space-4);
    align-items: center;
    font-size: var(--vx-font-size-xs);
    color: var(--vx-text-secondary);
  }
  .btn-legend-head {
    font-weight: var(--vx-font-weight-medium);
    color: var(--vx-text-caption);
    text-align: center;
  }
  .btn-legend-label {
    color: var(--vx-text-secondary);
    font-size: var(--vx-font-size-md);
  }
  .btn-cell {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--vx-space-2) 0;
  }

  /* 虚线按钮 */
  .vx-btn-dashed {
    background: var(--vx-bg-base);
    color: var(--vx-btn-outline-text);
    border: 1px dashed var(--vx-primary);
  }
  .vx-btn-dashed:hover:not(:disabled) {
    color: var(--vx-btn-secondary-hover);
    border-color: var(--vx-btn-secondary-hover);
    background: var(--vx-bg-base);
  }
  .vx-btn-dashed:active:not(:disabled) {
    color: var(--vx-btn-secondary-active);
    border-color: var(--vx-btn-secondary-active);
    background: var(--vx-bg-base);
  }

  /* 文字链接按钮 */
  .vx-btn-text {
    background: transparent;
    color: var(--vx-primary);
    border-color: transparent;
    padding-left: 0;
    padding-right: 0;
  }
  .vx-btn-text:hover:not(:disabled) {
    color: var(--vx-primary-hover);
    background: transparent;
    border-color: transparent;
  }
  .vx-btn-text:active:not(:disabled) {
    color: var(--vx-primary-active);
    background: transparent;
    border-color: transparent;
  }
  .vx-btn-text:disabled {
    background: transparent;
    color: var(--vx-text-disabled);
    border-color: transparent;
  }

  /* 危险文字链接 */
  .vx-btn-text.vx-btn-text-danger {
    color: var(--vx-error);
  }
  .vx-btn-text.vx-btn-text-danger:hover:not(:disabled) {
    color: var(--vx-btn-danger-hover);
  }
  .vx-btn-text.vx-btn-text-danger:active:not(:disabled) {
    color: var(--vx-error-dark);
  }
</style>
</head>
<body>

<!-- ==================== 底层列表页 ==================== -->
<div class="page">
  <div class="page-header">
    <h1 class="page-title">设备管理</h1>
    <button class="vx-btn vx-btn-primary vx-btn-lg">新建设备</button>
  </div>

  <div class="list-card">
    <div class="list-toolbar">
      <span class="list-toolbar-title">设备列表</span>
      <button class="vx-btn vx-btn-secondary">批量操作</button>
    </div>
    <table class="list-table">
      <thead>
        <tr>
          <th style="width:40%">设备名称</th>
          <th>所属分组</th>
          <th>状态</th>
          <th style="width:160px">操作</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>车载智能终端 V200</td>
          <td>东风岚图-总部</td>
          <td><span class="vx-tag vx-tag-success">在线</span></td>
          <td>
            <span class="row-actions">
              <button class="row-action-link">查看</button>
              <button class="row-action-link">编辑</button>
              <button class="row-action-link danger">删除</button>
            </span>
          </td>
        </tr>
        <tr>
          <td>车联网网关 G100</td>
          <td>东风岚图-工厂</td>
          <td><span class="vx-tag vx-tag-warning">离线</span></td>
          <td>
            <span class="row-actions">
              <button class="row-action-link">查看</button>
              <button class="row-action-link">编辑</button>
              <button class="row-action-link danger">删除</button>
            </span>
          </td>
        </tr>
        <tr>
          <td>智能座舱模块 C300</td>
          <td>研发中心</td>
          <td><span class="vx-tag vx-tag-success">在线</span></td>
          <td>
            <span class="row-actions">
              <button class="row-action-link">查看</button>
              <button class="row-action-link">编辑</button>
              <button class="row-action-link danger">删除</button>
            </span>
          </td>
        </tr>
        <tr>
          <td>OTA 升级单元 OTA-01</td>
          <td>质量部</td>
          <td><span class="vx-tag">未激活</span></td>
          <td>
            <span class="row-actions">
              <button class="row-action-link">查看</button>
              <button class="row-action-link">编辑</button>
              <button class="row-action-link danger">删除</button>
            </span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- ==================== 遮罩 + 弹窗 ==================== -->
<div class="modal-mask">
  <div class="vx-modal">
    <!-- 弹窗头部 -->
    <div class="vx-modal-header">
      <h2 class="vx-modal-title">删除确认</h2>
      <button class="vx-modal-close" aria-label="关闭">✕</button>
    </div>

    <!-- 弹窗内容 -->
    <div class="vx-modal-body">
      <p class="modal-desc">
        确定要删除选中的设备吗？删除后数据将无法恢复，请谨慎操作。
      </p>

      <!-- 单选项组：4 个 Option -->
      <div class="vx-radio-group">
        <label class="vx-radio">
          <input type="radio" name="delete-scope" checked />
          <span class="vx-radio-box"></span>
          仅删除当前设备
        </label>
        <label class="vx-radio">
          <input type="radio" name="delete-scope" />
          <span class="vx-radio-box"></span>
          删除设备及其历史数据
        </label>
        <label class="vx-radio">
          <input type="radio" name="delete-scope" />
          <span class="vx-radio-box"></span>
          删除设备并解除子设备关联
        </label>
        <label class="vx-radio">
          <input type="radio" name="delete-scope" />
          <span class="vx-radio-box"></span>
          全部删除（含关联配置与日志）
        </label>
      </div>
    </div>

    <!-- 弹窗底部：主要按钮在左，次要在右 -->
    <div class="vx-modal-footer">
      <button class="vx-btn vx-btn-primary">确定删除</button>
      <button class="vx-btn vx-btn-secondary">取消</button>
    </div>
  </div>
</div>

<!-- ==================== 按钮类型对照展示 ==================== -->
<div class="demo-section">
  <div class="demo-section-title">按钮类型 · Normal / Disabled 对照</div>
  <div class="btn-legend">
    <div></div>
    <div class="btn-legend-head">Normal</div>
    <div class="btn-legend-head">Disabled</div>

    <div class="btn-legend-label">主要</div>
    <div class="btn-cell"><button class="vx-btn vx-btn-primary">主要按钮</button></div>
    <div class="btn-cell"><button class="vx-btn vx-btn-primary" disabled>主要按钮</button></div>

    <div class="btn-legend-label">次要</div>
    <div class="btn-cell"><button class="vx-btn vx-btn-secondary">次要按钮</button></div>
    <div class="btn-cell"><button class="vx-btn vx-btn-secondary" disabled>次要按钮</button></div>

    <div class="btn-legend-label">线框</div>
    <div class="btn-cell"><button class="vx-btn vx-btn-outline">线框按钮</button></div>
    <div class="btn-cell"><button class="vx-btn vx-btn-outline" disabled>线框按钮</button></div>

    <div class="btn-legend-label">虚线</div>
    <div class="btn-cell"><button class="vx-btn vx-btn-dashed">虚线按钮</button></div>
    <div class="btn-cell"><button class="vx-btn vx-btn-dashed" disabled>虚线按钮</button></div>

    <div class="btn-legend-label">文字链接</div>
    <div class="btn-cell"><button class="vx-btn vx-btn-text">文字链接</button></div>
    <div class="btn-cell"><button class="vx-btn vx-btn-text" disabled>文字链接</button></div>
  </div>

  <!-- 含危险按钮「删除」的按钮组示例 -->
  <div class="demo-section-title" style="margin-top: var(--vx-space-6)">危险按钮组示例</div>
  <div class="vx-modal-footer" style="border: 1px solid var(--vx-line-1); border-radius: var(--vx-radius-lg); padding: var(--vx-space-4);">
    <button class="vx-btn vx-btn-danger">删除</button>
    <button class="vx-btn vx-btn-secondary">取消</button>
  </div>
</div>

</body>
</html>
