<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>申请审批列表 - Voyah</title>
<style>
  /* ========== Voyah 设计规范 - 设计令牌 ========== */
  :root {
    /* 主色 - 岚图蓝 */
    --voyah-blue-50:  #E6F0FF;
    --voyah-blue-100: #CCE1FF;
    --voyah-blue-200: #99C2FF;
    --voyah-blue-300: #66A4FF;
    --voyah-blue-400: #3385FF;
    --voyah-blue-500: #0066FF;
    --voyah-blue-600: #0052CC;
    --voyah-blue-700: #003D99;
    --voyah-blue-800: #002966;
    --voyah-blue-900: #001433;

    /* 中性色 - 文字 */
    --text-primary:   #1F2329;
    --text-secondary: #646A73;
    --text-tertiary:  #8F959E;
    --text-quaternary:#BBBFC4;
    --text-inverse:   #FFFFFF;

    /* 中性色 - 填充（三级语义） */
    --fill-primary:   #F2F3F5;   /* 一级填充：主要操作/强调背景 */
    --fill-secondary: #F7F8FA;   /* 二级填充：次强调/卡片背景 */
    --fill-tertiary:  #FAFBFC;   /* 三级填充：最弱/悬浮背景 */
    --fill-hover:     #F2F3F5;   /* hover 填充 */
    --fill-active:    #E5E6EB;   /* active/选中填充 */
    --fill-disabled:  #F2F3F5;

    /* 中性色 - 边框 */
    --border-primary:   #E5E6EB;
    --border-secondary: #EDEEF0;
    --border-tertiary:  #F2F3F5;

    /* 中性色 - 背景 */
    --bg-body:     #F5F6F7;
    --bg-surface:  #FFFFFF;
    --bg-mask:     rgba(0,0,0,0.45);

    /* 功能色 - 语义色 */
    --success-500: #00B42A;
    --success-50:  #E8FFEA;
    --warning-500: #FF7D00;
    --warning-50:  #FFF7E8;
    --danger-500:  #F53F3F;
    --danger-50:   #FFECE8;
    --info-500:    #0066FF;
    --info-50:     #E6F0FF;
    --pending-500: #FF7D00;
    --pending-50:  #FFF7E8;

    /* 圆角 */
    --radius-sm: 4px;
    --radius-md: 6px;
    --radius-lg: 8px;
    --radius-xl: 12px;
    --radius-round: 999px;

    /* 阴影 */
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
    --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);

    /* 间距 */
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 20px;
    --space-6: 24px;
    --space-8: 32px;

    /* 字号 */
    --font-xs:   12px;
    --font-sm:   13px;
    --font-base: 14px;
    --font-md:   15px;
    --font-lg:   16px;
    --font-xl:   18px;
    --font-2xl:  20px;

    /* 字重 */
    --weight-regular: 400;
    --weight-medium:  500;
    --weight-semibold: 600;

    /* 动效 */
    --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    --transition-base: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei",
                 "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: var(--font-base);
    color: var(--text-primary);
    background-color: var(--bg-body);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ========== 页面容器 ========== */
  .page {
    max-width: 1200px;
    margin: 0 auto;
    padding: var(--space-6);
  }

  .page-title {
    font-size: var(--font-2xl);
    font-weight: var(--weight-semibold);
    color: var(--text-primary);
    margin-bottom: var(--space-6);
  }

  /* ========== 卡片容器 ========== */
  .card {
    background: var(--bg-surface);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }

  /* ========== 头部：Tabs + Segmented ========== */
  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 var(--space-6);
    border-bottom: 1px solid var(--border-tertiary);
  }

  /* Tabs */
  .tabs {
    display: flex;
    align-items: center;
    gap: var(--space-8);
    list-style: none;
    position: relative;
  }

  .tab-item {
    position: relative;
    padding: var(--space-5) 0;
    font-size: var(--font-base);
    color: var(--text-secondary);
    cursor: pointer;
    user-select: none;
    transition: color var(--transition-fast);
    display: flex;
    align-items: center;
    gap: var(--space-2);
    white-space: nowrap;
  }

  .tab-item:hover {
    color: var(--text-primary);
  }

  .tab-item.is-active {
    color: var(--text-primary);
    font-weight: var(--weight-medium);
  }

  .tab-item.is-active::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: -1px;
    height: 2px;
    background: var(--voyah-blue-500);
    border-radius: 2px 2px 0 0;
  }

  /* Badge */
  .badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    font-size: 11px;
    font-weight: var(--weight-medium);
    color: var(--text-inverse);
    background: var(--danger-500);
    border-radius: var(--radius-round);
    line-height: 1;
  }

  /* Segmented */
  .segmented {
    display: inline-flex;
    padding: 2px;
    background: var(--fill-secondary);
    border-radius: var(--radius-md);
    gap: 2px;
  }

  .segmented-item {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-1);
    padding: var(--space-2) var(--space-4);
    font-size: var(--font-sm);
    color: var(--text-secondary);
    border-radius: var(--radius-sm);
    cursor: pointer;
    user-select: none;
    transition: all var(--transition-fast);
    min-width: 72px;
  }

  .segmented-item:hover {
    color: var(--text-primary);
    background: var(--fill-primary);
  }

  .segmented-item.is-active {
    color: var(--text-primary);
    background: var(--bg-surface);
    font-weight: var(--weight-medium);
    box-shadow: var(--shadow-sm);
  }

  .segmented-item svg {
    width: 14px;
    height: 14px;
  }

  /* ========== 列表视图 ========== */
  .list-view {
    padding: var(--space-3) 0;
  }

  .list-row {
    display: flex;
    align-items: center;
    padding: var(--space-4) var(--space-6);
    gap: var(--space-4);
    cursor: pointer;
    transition: background-color var(--transition-fast);
    border-bottom: 1px solid transparent;
    position: relative;
  }

  .list-row:last-child { border-bottom: none; }

  .list-row:hover {
    background-color: var(--fill-tertiary);
  }

  .list-row.is-selected {
    background-color: var(--fill-secondary);
  }

  .list-row.is-selected:hover {
    background-color: var(--fill-secondary);
  }

  /* 头像 */
  .avatar {
    width: 40px;
    height: 40px;
    border-radius: var(--radius-round);
    background: linear-gradient(135deg, var(--voyah-blue-400), var(--voyah-blue-600));
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: var(--font-sm);
    font-weight: var(--weight-medium);
    flex-shrink: 0;
    letter-spacing: 0.5px;
  }

  .avatar.color-1 { background: linear-gradient(135deg, #66B1FF, #0066FF); }
  .avatar.color-2 { background: linear-gradient(135deg, #FFC069, #FF7D00); }
  .avatar.color-3 { background: linear-gradient(135deg, #7BC67E, #00B42A); }
  .avatar.color-4 { background: linear-gradient(135deg, #F7727D, #F53F3F); }
  .avatar.color-5 { background: linear-gradient(135deg, #B37FEB, #722ED1); }
  .avatar.color-6 { background: linear-gradient(135deg, #4CC9F0, #0096C7); }

  /* 行主要内容 */
  .row-main {
    flex: 1;
    display: flex;
    align-items: center;
    gap: var(--space-6);
    min-width: 0;
  }

  .row-user {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 140px;
  }

  .row-name {
    font-size: var(--font-base);
    font-weight: var(--weight-medium);
    color: var(--text-primary);
  }

  .row-dept {
    font-size: var(--font-xs);
    color: var(--text-tertiary);
  }

  .row-title {
    flex: 1;
    font-size: var(--font-base);
    color: var(--text-primary);
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Tag 状态 */
  .tag {
    display: inline-flex;
    align-items: center;
    padding: 2px 8px;
    font-size: var(--font-xs);
    font-weight: var(--weight-regular);
    border-radius: var(--radius-sm);
    line-height: 20px;
    height: 22px;
    white-space: nowrap;
  }

  .tag-dot::before {
    content: "";
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    margin-right: 6px;
    background: currentColor;
  }

  .tag-status {
    min-width: 72px;
    justify-content: center;
  }

  .tag--pending {
    color: var(--warning-500);
    background: var(--warning-50);
    border: 1px solid transparent;
  }

  .tag--approved {
    color: var(--success-500);
    background: var(--success-50);
    border: 1px solid transparent;
  }

  .tag--rejected {
    color: var(--danger-500);
    background: var(--danger-50);
    border: 1px solid transparent;
  }

  .tag--info {
    color: var(--info-500);
    background: var(--info-50);
    border: 1px solid transparent;
  }

  /* 时间 */
  .row-time {
    font-size: var(--font-sm);
    color: var(--text-tertiary);
    white-space: nowrap;
    min-width: 100px;
    text-align: right;
  }

  /* 操作区 */
  .row-actions {
    display: flex;
    align-items: center;
    gap: var(--space-4);
    flex-shrink: 0;
  }

  .action-link {
    font-size: var(--font-sm);
    color: var(--voyah-blue-500);
    cursor: pointer;
    transition: color var(--transition-fast);
    background: none;
    border: none;
    padding: 0;
    font-family: inherit;
  }

  .action-link:hover {
    color: var(--voyah-blue-600);
  }

  .action-link--text {
    color: var(--text-secondary);
  }

  .action-link--text:hover {
    color: var(--voyah-blue-500);
  }

  .action-link--danger {
    color: var(--danger-500);
  }

  .action-link--danger:hover {
    color: #CB2634;
  }

  /* ========== 卡片视图 ========== */
  .card-view {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: var(--space-4);
    padding: var(--space-6);
  }

  .approval-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-tertiary);
    border-radius: var(--radius-lg);
    padding: var(--space-5);
    cursor: pointer;
    transition: all var(--transition-base);
    display: flex;
    flex-direction: column;
    gap: var(--space-4);
  }

  .approval-card:hover {
    border-color: var(--voyah-blue-300);
    box-shadow: var(--shadow-md);
    transform: translateY(-1px);
  }

  .approval-card.is-selected {
    border-color: var(--voyah-blue-500);
    background: var(--fill-tertiary);
  }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--space-3);
  }

  .card-user {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    min-width: 0;
    flex: 1;
  }

  .card-user-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }

  .card-username {
    font-size: var(--font-md);
    font-weight: var(--weight-medium);
    color: var(--text-primary);
  }

  .card-userdept {
    font-size: var(--font-xs);
    color: var(--text-tertiary);
  }

  .card-title {
    font-size: var(--font-base);
    color: var(--text-primary);
    font-weight: var(--weight-medium);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: var(--font-xs);
    color: var(--text-tertiary);
    padding-top: var(--space-3);
    border-top: 1px solid var(--border-tertiary);
  }

  .card-actions {
    display: flex;
    gap: var(--space-4);
  }

  /* 空状态占位 */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: var(--space-8);
    color: var(--text-tertiary);
    font-size: var(--font-sm);
  }

  .empty-state-icon {
    width: 64px;
    height: 64px;
    margin-bottom: var(--space-3);
    opacity: 0.4;
  }

  /* 视图切换动画 */
  .view-container {
    min-height: 400px;
  }

  /* 滚动条美化 */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: var(--border-primary);
    border-radius: 4px;
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-quaternary); }
</style>
</head>
<body>
  <div class="page">
    <h1 class="page-title">申请审批</h1>

    <div class="card">
      <!-- 头部：Tabs + Segmented -->
      <div class="card-header">
        <ul class="tabs" role="tablist">
          <li class="tab-item is-active" data-tab="all" role="tab">全部</li>
          <li class="tab-item" data-tab="pending" role="tab">
            待审批
            <span class="badge">5</span>
          </li>
          <li class="tab-item" data-tab="approved" role="tab">已通过</li>
          <li class="tab-item" data-tab="rejected" role="tab">已拒绝</li>
        </ul>

        <div class="segmented" role="radiogroup">
          <div class="segmented-item is-active" data-view="list" role="radio">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M3 4h10M3 8h10M3 12h10" stroke-linecap="round"/>
            </svg>
            列表
          </div>
          <div class="segmented-item" data-view="card" role="radio">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="2.5" y="2.5" width="5" height="5" rx="1"/>
              <rect x="8.5" y="2.5" width="5" height="5" rx="1"/>
              <rect x="2.5" y="8.5" width="5" height="5" rx="1"/>
              <rect x="8.5" y="8.5" width="5" height="5" rx="1"/>
            </svg>
            卡片
          </div>
        </div>
      </div>

      <!-- 内容区 -->
      <div class="view-container" id="viewContainer">
        <!-- 列表视图 -->
        <div class="list-view" id="listView"></div>
        <!-- 卡片视图 -->
        <div class="card-view" id="cardView" style="display:none;"></div>
      </div>
    </div>
  </div>

<script>
  // 模拟数据
  const approvalData = [
    { id: 1, name: '张伟', dept: '产品设计部', title: '2024 款 FREE 内饰配色方案评审申请', status: 'pending', time: '10分钟前', avatarColor: 1 },
    { id: 2, name: '李娜', dept: '研发中心', title: '岚图梦想家 OTA 3.0 功能升级申请', status: 'pending', time: '30分钟前', avatarColor: 2 },
    { id: 3, name: '王强', dept: '市场营销部', title: '广州车展展位搭建费用报销', status: 'pending', time: '1小时前', avatarColor: 3 },
    { id: 4, name: '刘芳', dept: '人力资源部', title: '2026 届校园招聘预算申请', status: 'pending', time: '2小时前', avatarColor: 4 },
    { id: 5, name: '陈明', dept: '供应链管理部', title: '动力电池供应商资质审核', status: 'pending', time: '3小时前', avatarColor: 5 },
    { id: 6, name: '赵静', dept: '财务管理部', title: 'Q4 季度财务报表审批', status: 'approved', time: '昨天 16:20', avatarColor: 6 },
    { id: 7, name: '孙磊', dept: '研发中心', title: '智能驾驶算法迭代方案', status: 'approved', time: '昨天 14:05', avatarColor: 1 },
    { id: 8, name: '周琳', dept: '品牌公关部', title: '品牌代言人合作提案', status: 'approved', time: '11月5日 10:30', avatarColor: 2 },
    { id: 9, name: '吴涛', dept: '销售事业部', title: '华东区域经销商激励政策', status: 'rejected', time: '11月4日 15:45', avatarColor: 3 },
    { id: 10, name: '郑雪', dept: '法务合规部', title: '海外市场合规审查报告', status: 'rejected', time: '11月3日 09:12', avatarColor: 4 },
    { id: 11, name: '黄凯', dept: '质量管控部', title: '新车碰撞测试结果评估', status: 'approved', time: '11月2日 11:20', avatarColor: 5 },
    { id: 12, name: '林倩', dept: '用户运营部', title: '车主 APP 4.0 版本迭代需求', status: 'pending', time: '4小时前', avatarColor: 6 },
  ];

  const statusMap = {
    pending:  { text: '待审批', cls: 'tag--pending' },
    approved: { text: '已通过', cls: 'tag--approved' },
    rejected: { text: '已拒绝', cls: 'tag--rejected' },
  };

  let currentTab = 'all';
  let currentView = 'list';
  let selectedIds = new Set();

  const $ = (sel) => document.querySelector(sel);
  const listView = $('#listView');
  const cardView = $('#cardView');

  // 渲染列表视图
  function renderList() {
    const data = filterData();
    if (data.length === 0) {
      listView.innerHTML = renderEmpty();
      return;
    }
    listView.innerHTML = data.map(item => {
      const selected = selectedIds.has(item.id) ? 'is-selected' : '';
      const status = statusMap[item.status];
      const initials = item.name.slice(-2);
      const actions = item.status === 'pending'
        ? `<button class="action-link" data-action="approve" data-id="${item.id}">通过</button>
           <button class="action-link action-link--danger" data-action="reject" data-id="${item.id}">拒绝</button>`
        : `<button class="action-link action-link--text" data-action="detail" data-id="${item.id}">查看详情</button>`;
      return `
        <div class="list-row ${selected}" data-id="${item.id}">
          <div class="avatar color-${item.avatarColor}">${initials}</div>
          <div class="row-main">
            <div class="row-user">
              <span class="row-name">${item.name}</span>
              <span class="row-dept">${item.dept}</span>
            </div>
            <div class="row-title">${item.title}</div>
            <span class="tag tag-status tag-dot ${status.cls}">${status.text}</span>
            <span class="row-time">${item.time}</span>
          </div>
          <div class="row-actions">
            ${actions}
          </div>
        </div>
      `;
    }).join('');
  }

  // 渲染卡片视图
  function renderCard() {
    const data = filterData();
    if (data.length === 0) {
      cardView.innerHTML = renderEmpty();
      return;
    }
    cardView.innerHTML = data.map(item => {
      const selected = selectedIds.has(item.id) ? 'is-selected' : '';
      const status = statusMap[item.status];
      const initials = item.name.slice(-2);
      const actions = item.status === 'pending'
        ? `<button class="action-link" data-action="approve" data-id="${item.id}">通过</button>
           <button class="action-link action-link--danger" data-action="reject" data-id="${item.id}">拒绝</button>`
        : `<button class="action-link action-link--text" data-action="detail" data-id="${item.id}">详情</button>`;
      return `
        <div class="approval-card ${selected}" data-id="${item.id}">
          <div class="card-top">
            <div class="card-user">
              <div class="avatar color-${item.avatarColor}">${initials}</div>
              <div class="card-user-info">
                <span class="card-username">${item.name}</span>
                <span class="card-userdept">${item.dept}</span>
              </div>
            </div>
            <span class="tag tag-dot ${status.cls}">${status.text}</span>
          </div>
          <div class="card-title">${item.title}</div>
          <div class="card-meta">
            <span>${item.time}</span>
            <div class="card-actions">
              ${actions}
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  function renderEmpty() {
    return `<div class="empty-state">
      <svg class="empty-state-icon" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="12" y="10" width="40" height="44" rx="4"/>
        <path d="M20 22h24M20 32h24M20 42h16" stroke-linecap="round"/>
      </svg>
      <span>暂无数据</span>
    </div>`;
  }

  function filterData() {
    if (currentTab === 'all') return approvalData;
    return approvalData.filter(d => d.status === currentTab);
  }

  function render() {
    if (currentView === 'list') {
      listView.style.display = '';
      cardView.style.display = 'none';
      renderList();
    } else {
      listView.style.display = 'none';
      cardView.style.display = '';
      renderCard();
    }
    // 更新 badge
    const pendingCount = approvalData.filter(d => d.status === 'pending').length;
    const badge = document.querySelector('.tab-item[data-tab="pending"] .badge');
    if (badge) badge.textContent = pendingCount;
  }

  // Tabs 切换
  document.querySelectorAll('.tab-item').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('is-active'));
      tab.classList.add('is-active');
      currentTab = tab.dataset.tab;
      selectedIds.clear();
      render();
    });
  });

  // Segmented 视图切换
  document.querySelectorAll('.segmented-item').forEach(item => {
    item.addEventListener('click', () => {
      document.querySelectorAll('.segmented-item').forEach(i => i.classList.remove('is-active'));
      item.classList.add('is-active');
      currentView = item.dataset.view;
      render();
    });
  });

  // 行选中 + 操作代理
  document.getElementById('viewContainer').addEventListener('click', (e) => {
    const actionBtn = e.target.closest('[data-action]');
    if (actionBtn) {
      e.stopPropagation();
      const id = Number(actionBtn.dataset.id);
      const action = actionBtn.dataset.action;
      if (action === 'approve') {
        const item = approvalData.find(d => d.id === id);
        if (item) item.status = 'approved';
      } else if (action === 'reject') {
        const item = approvalData.find(d => d.id === id);
        if (item) item.status = 'rejected';
      }
      render();
      return;
    }

    const row = e.target.closest('.list-row, .approval-card');
    if (row) {
      const id = Number(row.dataset.id);
      if (selectedIds.has(id)) {
        selectedIds.delete(id);
      } else {
        selectedIds.clear();
        selectedIds.add(id);
      }
      render();
    }
  });

  // 初始化
  render();
</script>
</body>
</html>
