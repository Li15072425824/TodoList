<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>用户管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { background-color: #f5f7fa; }
    .tw-container { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }
    .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    .avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff; display: inline-flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="tw-container">
    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-2xl font-bold text-gray-800 m-0">用户管理</h1>
        <p class="text-gray-500 mb-0 mt-1">管理系统中的所有用户账户</p>
      </div>
      <button type="button" class="btn btn-primary">+ 新增用户</button>
    </div>

    <!-- Toolbar -->
    <div class="bg-white rounded-lg shadow-sm p-4 mb-4 flex flex-wrap items-center gap-3">
      <div class="flex-grow max-w-md">
        <input type="text" class="form-control" placeholder="搜索用户名或邮箱..." />
      </div>
      <select class="form-select w-auto">
        <option selected>全部角色</option>
        <option>管理员</option>
        <option>编辑</option>
        <option>普通用户</option>
      </select>
      <select class="form-select w-auto">
        <option selected>全部状态</option>
        <option>启用</option>
        <option>禁用</option>
      </select>
      <button type="button" class="btn btn-outline-secondary">筛选</button>
      <button type="button" class="btn btn-outline-danger">批量删除</button>
    </div>

    <!-- Table -->
    <div class="bg-white rounded-lg shadow-sm overflow-hidden">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th scope="col" style="width: 40px;"><input class="form-check-input" type="checkbox" /></th>
            <th scope="col">用户</th>
            <th scope="col">邮箱</th>
            <th scope="col">角色</th>
            <th scope="col">状态</th>
            <th scope="col">最后登录</th>
            <th scope="col" style="width: 180px;">操作</th>
          </tr>
        </thead>
        <tbody id="userTableBody">
          <!-- rows injected by JS -->
        </tbody>
      </table>

      <!-- Pagination -->
      <div class="px-4 py-3 border-top d-flex justify-content-between align-items-center">
        <span class="text-muted small">共 128 条记录，当前第 1 / 13 页</span>
        <nav>
          <ul class="pagination mb-0">
            <li class="page-item disabled"><a class="page-link" href="#">上一页</a></li>
            <li class="page-item active"><a class="page-link" href="#">1</a></li>
            <li class="page-item"><a class="page-link" href="#">2</a></li>
            <li class="page-item"><a class="page-link" href="#">3</a></li>
            <li class="page-item"><a class="page-link" href="#">4</a></li>
            <li class="page-item"><a class="page-link" href="#">5</a></li>
            <li class="page-item"><a class="page-link" href="#">下一页</a></li>
          </ul>
        </nav>
      </div>
    </div>
  </div>

  <script>
    const users = [
      { name: '张伟', email: 'zhangwei@example.com', role: '管理员', status: 'active', lastLogin: '2026-11-09 10:23' },
      { name: '李娜', email: 'lina@example.com', role: '编辑', status: 'active', lastLogin: '2026-11-08 16:45' },
      { name: '王强', email: 'wangqiang@example.com', role: '普通用户', status: 'disabled', lastLogin: '2026-10-22 09:10' },
      { name: '刘洋', email: 'liuyang@example.com', role: '编辑', status: 'active', lastLogin: '2026-11-09 08:02' },
      { name: '陈静', email: 'chenjing@example.com', role: '普通用户', status: 'active', lastLogin: '2026-11-07 14:30' },
      { name: '赵磊', email: 'zhaolei@example.com', role: '普通用户', status: 'disabled', lastLogin: '2026-09-15 11:20' },
      { name: '孙悦', email: 'sunyue@example.com', role: '管理员', status: 'active', lastLogin: '2026-11-09 09:55' },
      { name: '周杰', email: 'zhoujie@example.com', role: '普通用户', status: 'active', lastLogin: '2026-11-06 18:40' },
    ];

    const roleBadge = {
      '管理员': 'bg-danger-subtle text-danger',
      '编辑': 'bg-primary-subtle text-primary',
      '普通用户': 'bg-secondary-subtle text-secondary',
    };

    const statusMap = {
      active:   { text: '启用',  dot: '#198754', cls: 'text-success' },
      disabled: { text: '禁用',  dot: '#6c757d', cls: 'text-muted' },
    };

    const initials = (name) => name.slice(0, 1);

    const tbody = document.getElementById('userTableBody');
    tbody.innerHTML = users.map(u => {
      const s = statusMap[u.status];
      return `
        <tr>
          <td><input class="form-check-input" type="checkbox" /></td>
          <td>
            <div class="d-flex align-items-center gap-2">
              <span class="avatar">${initials(u.name)}</span>
              <span class="fw-medium">${u.name}</span>
            </div>
          </td>
          <td class="text-muted">${u.email}</td>
          <td><span class="badge rounded-pill ${roleBadge[u.role]}">${u.role}</span></td>
          <td><span class="${s.cls}"><span class="status-dot" style="background:${s.dot}"></span>${s.text}</span></td>
          <td class="text-muted small">${u.lastLogin}</td>
          <td>
            <button type="button" class="btn btn-sm btn-outline-primary me-1">编辑</button>
            <button type="button" class="btn btn-sm btn-outline-danger">删除</button>
          </td>
        </tr>
      `;
    }).join('');
  </script>
</body>
</html>
