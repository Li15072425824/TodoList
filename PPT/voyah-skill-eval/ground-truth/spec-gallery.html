<style>

  nav.toc a{display:block;padding:8px 16px;color:#666;text-decoration:none}
  nav.toc a:hover{color:#3773DB;background:#F7F9FE}
  nav.toc a .st{float:right;font-size:11px}
  main{margin-left:166px;padding:24px;max-width:1250px}
  section.block{background:#fff;border:1px solid #EBEBEB;border-radius:8px;padding:24px;margin-bottom:24px}

  .el{width:198px;border:1px solid #EBEBEB;border-radius:6px;overflow:hidden;position:relative}

  .el .meta{padding:8px 10px;font-size:12px;line-height:1.6}
  .el .token{font-weight:600;color:#111}
  .el .hex{color:#666;font-family:Menlo,monospace;font-size:11px}
  .el .usage{color:#666}
  .flag{display:inline-block;font-size:11px;color:#B25E00;background:#FFF1DB;border:1px solid #FFD77E;border-radius:3px;padding:0 5px;margin-top:4px}
  .uflag{display:inline-block;font-size:11px;color:#0B7A47;background:#E3F8E8;border:1px solid #A8E1A6;border-radius:3px;padding:0 5px;margin-top:4px}
  .ctrl{display:flex;gap:6px;padding:0 10px 10px;font-size:12px}
  .ctrl button{border:1px solid #DEDEDE;background:#fff;border-radius:3px;padding:2px 8px;cursor:pointer}
  .ctrl button.pass.on{background:#D6F1E0;border-color:#20A870;color:#097E4F}
  .ctrl button.fail.on{background:#FCEBEA;border-color:#FF2020;color:#CF2E2E}
  .el.locked .ctrl button{cursor:default;opacity:.85}
  .el .lock{position:absolute;top:6px;right:6px;font-size:12px}
  .el .note{display:none;margin:0 10px 10px}
  .el.rejected .note{display:block}
  .el .note input{width:100%;border:1px solid #DEDEDE;border-radius:3px;padding:3px 6px;font-size:12px}
  .el.passed{outline:2px solid #20A870;outline-offset:-2px}

  {id:'spacing.padding.card',token:'卡片',hex:'16 × 4 边',usage:'卡片内边距',demo:{pad:[16,16,16,16],label:'卡片\n16×4'}},
  {id:'spacing.padding.input',token:'输入框内容',hex:'L12 R12 T6 B6',usage:'⚠ 6px 为设计稿故意展示的非 4 倍数豁免示例',demo:{pad:[12,12,6,6],label:'输入框\n12/12/6/6'}},
 ]},
 {name:'其他',items:[
  {id:'spacing.shadow.modal',token:'弹窗阴影',hex:'0 1px 20px rgba(0,0,0,0.08)',usage:'弹窗投影',demo:{shadow:'0px 1px 20px 0px rgba(0,0,0,0.08)'}},
 ]},
];
for(let n=1;n<=20;n++){
  DATA[4].groups[0].items.push({id:`spacing.s${n}`,token:`S${n}`,hex:`${n*4}px`,usage:`间距梯度第 ${n} 档`,demo:{gap:n*4}});
}

/* ============ 渲染 ============ */
function chipHTML(it){
  if(it.labelOnly)return `<div class="chip" style="height:auto;background:#FAFAFA;padding:6px 10px;font-weight:600;color:#111">${it.text}</div>`;
  if(it.demo){
    const d=it.demo;
    if(d.size)return btnDemoHTML(it);
    if(d.gap!==undefined)
      return `<div class="chip" style="height:auto;min-height:56px;justify-content:center"><div style="display:flex;align-items:center"><div style="width:24px;height:16px;background:#3773DB;border-radius:2px"></div><div style="width:${d.gap}px;min-width:2px;height:10px;background:#FFA2A2"></div><div style="width:24px;height:16px;background:#3773DB;border-radius:2px"></div></div><span style="font-size:11px;color:#999;margin-left:8px">${d.gap}px</span></div>`;
    if(d.pad){
      const[a,r,b,l]=d.pad;
      return `<div class="chip" style="height:auto;min-height:56px;justify-content:center;background:#F5F5F5"><div style="width:120px;border:1px dashed #9A12B3;padding:${a}px ${r}px ${b}px ${l}px;border-radius:4px;background:#fff"><div style="height:16px;background:#3773DB;border-radius:2px"></div></div><span style="font-size:10px;color:#666;margin-left:6px;white-space:pre-line;text-align:left">${d.label}</span></div>`;
    }
    if(d.shadow)
      return `<div class="chip" style="height:auto;min-height:56px;justify-content:center;background:#F5F5F5"><div style="width:96px;height:36px;background:#fff;border-radius:6px;box-shadow:${d.shadow};display:flex;align-items:center;justify-content:center;font-size:12px;color:#333">弹窗</div></div>`;
    if(d.css)return `<div class="chip" style="height:auto;min-height:56px;justify-content:center"><div class="fontdemo" style="max-width:180px;${d.css}">${d.font}</div></div>`;
    if(d.hdivider)return `<div class="chip" style="flex-direction:column;justify-content:center;align-items:center;height:56px"><div style="font-size:13px;color:#111;margin-bottom:6px">标题</div><div style="width:74px;height:1px;background:#DEDEDE"></div></div>`;
    if(d.vdivider)return `<div class="chip" style="justify-content:center;height:56px"><span style="font-size:13px;color:#111">复制</span><div style="width:1px;height:12px;background:#DEDEDE;margin:0 8px"></div><span style="font-size:13px;color:#111">删除</span></div>`;
    return `<div class="chip" style="flex-direction:column;justify-content:center;align-items:center;height:56px"><div style="width:160px;border-top:${d.w} ${d.style} ${d.color||'#3773DB'}"></div><span style="font-size:11px;color:#999;margin-top:8px">${d.w} ${d.style}</span></div>`;
  }
  const s=it.sample;
  return `<div class="chip ${s.fg==='#fff'?'sample-text':''}" style="background:${s.bg};color:${s.fg}">${s.text}</div>`;
}
function groupsOf(sec){
  return sec.id==='color'?sec.groups.concat(sec.themeGroups()):sec.groups;
}
function render(){
  const main=document.getElementById('main');main.innerHTML='';
  const toc=document.getElementById('toc');toc.innerHTML='';
  /* 主题切换条 */
  const secC=document.createElement('section');secC.className='block';secC.id='sec-color';
  const tb=document.createElement('div');tb.className='themebtns';
  THEMES.forEach(t=>{
    const btn=document.createElement('button');
    btn.textContent=t.label;
    btn.style.background=t.key===curTheme?t.primary[0]:'';
    if(t.key===curTheme)btn.classList.add('on');
    btn.onclick=()=>{curTheme=t.key;render()};
    tb.appendChild(btn);
  });
  secC.innerHTML=`<h2>${DATA[0].title}</h2><div class="desc">${DATA[0].desc}</div>`;
  secC.appendChild(tb);
  DATA[0].groups.forEach(g=>secC.appendChild(renderGroup(g)));
  DATA[0].themeGroups().forEach(g=>secC.appendChild(renderGroup(g)));
  main.appendChild(secC);
  const a=document.createElement('a');a.href='#sec-color';
  a.innerHTML=`${DATA[0].title}<span class="st" id="toc-st-color"></span>`;toc.appendChild(a);
  DATA.slice(1).forEach(sec=>{
    const na=document.createElement('a');na.href='#sec-'+sec.id;
    na.innerHTML=`${sec.title}<span class="st" id="toc-st-${sec.id}"></span>`;toc.appendChild(na);
    const s=document.createElement('section');s.className='block';s.id='sec-'+sec.id;
    let inner=`<h2>${sec.title}</h2><div class="desc">${sec.desc}</div>`;
    sec.groups.forEach(g=>{inner+=renderGroupHTML(g)});
    s.innerHTML=inner;main.appendChild(s);
  });
  applyState();
}
function renderGroupHTML(g){
  if(!g.items.length)return '';
  let inner=`<h3 class="grp">${g.name}</h3><div class="swgrid">`;
  g.items.forEach(it=>{
    if(it.labelOnly){inner+=`<div class="grplabel">${it.text}</div>`;return;}
    inner+=`<div class="el" data-spec-id="${it.id}" id="el-${it.id}">
      ${chipHTML(it)}
      <div class="statusband"></div>
      <div class="meta"><div class="token">${it.token}</div>
        ${it.hex?`<div class="hex">${it.hex}</div>`:''}
        ${it.usage?`<div class="usage">${it.usage}</div>`:''}
        ${it.flag?`<div class="flag">⚠ ${it.flag}</div>`:''}
        ${it.uflag?`<div class="uflag">✎ ${it.uflag}</div>`:''}
      </div>
      <div class="ctrl">
        <button class="pass" onclick="setSt('${it.id}','pass')">✔ 通过</button>
        <button class="fail" onclick="setSt('${it.id}','fail')">✘ 问题</button>
      </div>
      <div class="note"><input placeholder="问题描述…" oninput="setNote('${it.id}',this.value)"></div>
    </div>`;
  });
  return inner+`</div>`;
}
function renderGroup(g){
  const div=document.createElement('div');div.innerHTML=renderGroupHTML(g);
  const frag=document.createDocumentFragment();
  while(div.firstChild)frag.appendChild(div.firstChild);
  return frag;
}
function applyState(){
  document.querySelectorAll('.el[data-spec-id]').forEach(el=>{
    const id=el.dataset.specId,st=state[id]||{},locked=!!st.locked;
    el.classList.toggle('passed',st.status==='pass');
    el.classList.toggle('rejected',st.status==='fail');
    el.classList.toggle('locked',locked);
    const band=el.querySelector('.statusband');
    band.textContent=locked?'🔒 已通过(上轮锁定,不可改)':st.status==='pass'?'✔ 已通过':st.status==='fail'?'✘ 有问题':'未填写';
    band.style.color=locked||st.status==='pass'?'#097E4F':st.status==='fail'?'#CF2E2E':'#999';
    const passBtn=el.querySelector('.pass'),failBtn=el.querySelector('.fail');
    passBtn.classList.toggle('on',st.status==='pass');
    failBtn.classList.toggle('on',st.status==='fail');
    if(locked){passBtn.onclick=null;failBtn.onclick=null;passBtn.style.pointerEvents='none';failBtn.style.pointerEvents='none';
      if(!el.querySelector('.lock')){const lk=document.createElement('span');lk.className='lock';lk.textContent='🔒';el.appendChild(lk);}}
    if(st.note)el.querySelector('.note input').value=st.note;
  });
  updateProgress();
  applyFilter();
}
function setSt(id,st){
  const cur=state[id]||{};
  if(cur.locked)return;
  state[id]=Object.assign({},cur,{status:st===cur.status?'':st});
  if(!state[id].status)delete state[id].status;
  localStorage.setItem(KEY,JSON.stringify(state));applyState();
}
function setNote(id,v){const cur=state[id]||{};state[id]=Object.assign({},cur,{note:v});localStorage.setItem(KEY,JSON.stringify(state));}
function visibleIds(){
  const ids=[];
  DATA.forEach(s=>{const gs=s.id==='color'?s.groups.concat(s.themeGroups()):s.groups;
    gs.forEach(g=>g.items.forEach(it=>{if(!it.labelOnly)ids.push(it.id)}))});
  return ids;
}
function updateProgress(){
  const ids=visibleIds();
  const done=ids.filter(i=>state[i]&&state[i].status).length,
        pass=ids.filter(i=>state[i]&&state[i].status==='pass').length,
        fail=ids.filter(i=>state[i]&&state[i].status==='fail').length;
  document.getElementById('progress-fill').style.width=ids.length?((done/ids.length)*100).toFixed(1)+'%':'0%';
  document.getElementById('progress-text').textContent=`已检核 ${done}/${ids.length} · 通过 ${pass} · 问题 ${fail} · 未填写 ${ids.length-done}`;
  DATA.forEach(s=>{
    const el=document.getElementById('toc-st-'+s.id);if(!el)return;
    const gs=s.id==='color'?s.groups.concat(s.themeGroups()):s.groups;
    const sid=[];gs.forEach(g=>g.items.forEach(it=>{if(!it.labelOnly)sid.push(it.id)}));
    const d=sid.filter(i=>state[i]&&state[i].status).length,f=sid.filter(i=>state[i]&&state[i].status==='fail').length;
    el.textContent=d?`${d}/${sid.length}${f?' ('+f+'✘)':''}`:'';
  });
}
function toggleFilter(){
  filterOpen=!filterOpen;
  const btn=document.getElementById('filter-btn');
  btn.style.background=filterOpen?'#3773DB':'';btn.style.color=filterOpen?'#fff':'';
  applyState();
}
function applyFilter(){
  document.querySelectorAll('#main .el[data-spec-id]').forEach(el=>{
    const st=state[el.dataset.specId]||{};
    /* 只隐藏「已通过」;问题项与未填写项保留待复核 */
    el.style.display=(filterOpen&&st.status==='pass')?'none':'';
  });
  if(filterOpen){
    document.querySelectorAll('#main h3.grp').forEach(h=>{
      let sib=h.nextElementSibling,shown=false;
      while(sib&&!sib.classList.contains('grp')){
        if(sib.classList&&sib.classList.contains('swgrid')){
          shown=[...sib.querySelectorAll('.el[data-spec-id]')].some(e=>e.style.display!=='none');
          // 分组说明行(grplabel)有可见内容也算
          if(!shown)shown=[...sib.querySelectorAll('.grplabel')].some(e=>e.offsetParent!==null||e.style.display!=='none');
        }
        sib=sib.nextElementSibling;
      }
      h.style.display=shown?'':'none';
      // 该 h3 之后的 swgrid 若整组隐藏也要隐藏(含 label 行)
      let s2=h.nextElementSibling;
      while(s2&&!s2.classList.contains('grp')){
        if(s2.classList&&s2.classList.contains('swgrid'))s2.style.display=shown?'':'none';
        s2=s2.nextElementSibling;
      }
    });
  } else {
    document.querySelectorAll('#main h3.grp,#main .swgrid').forEach(e=>e.style.display='');
  }
}
function exportLog(){
  const ids=visibleIds();
  const log={exportedAt:new Date().toISOString(),galleryVersion:'v2',
    summary:{total:ids.length,
    pass:ids.filter(i=>state[i]&&state[i].status==='pass').length,
    fail:ids.filter(i=>state[i]&&state[i].status==='fail').length,
    unchecked:ids.filter(i=>!state[i]||!state[i].status).length},
    items:ids.map(i=>({specId:i,status:(state[i]&&state[i].status)||'unchecked',locked:!!(state[i]&&state[i].locked),note:(state[i]&&state[i].note)||''}))};
  const blob=new Blob([JSON.stringify(log,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='review-log.json';a.click();
}
render();
</script>
</body>
