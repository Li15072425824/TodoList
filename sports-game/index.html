<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>领跑人生 · Pace for Life</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface-1: #fcfcfb;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --grid: #e1e0d9;
    --border: rgba(11,11,11,0.10);
    --accent: #2a78d6;
    --good: #1baf7a;
    --warn: #eb6834;
    --bad: #e34948;
    --gold: #c99000;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface-1: #1a1a19;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --grid: #2c2c2a;
      --border: rgba(255,255,255,0.10);
      --accent: #3987e5;
      --good: #199e70;
      --warn: #d95926;
      --bad: #e66767;
      --gold: #e0b23a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.55;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 20px 16px 72px; }

  header .hd-top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  header h1 { font-size: 22px; margin: 0; }
  header .sub { color: var(--text-secondary); font-size: 13px; margin: 2px 0 12px; }
  .badges { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .badge {
    font-size: 12px; padding: 3px 10px; border-radius: 999px;
    background: var(--surface-1); border: 1px solid var(--border); color: var(--text-secondary);
  }
  .badge b { color: var(--text-primary); }
  .badge.injury { color: var(--bad); border-color: var(--bad); }

  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 18px; overflow-x: auto; }
  .tabs button {
    appearance: none; border: none; background: transparent; color: var(--text-secondary);
    font: inherit; font-size: 14px; padding: 8px 14px; cursor: pointer; white-space: nowrap;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tabs button.active { color: var(--text-primary); font-weight: 600; border-bottom-color: var(--accent); }

  .card {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; margin-bottom: 16px;
  }
  .card h2 { font-size: 15px; margin: 0 0 12px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .card h2 .hint { font-weight: 400; color: var(--text-muted); font-size: 12px; }

  button.primary {
    font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    color: #fff; background: var(--accent); border: none; border-radius: 8px; padding: 9px 20px;
  }
  button.primary:hover { filter: brightness(1.08); }
  button.primary:disabled { opacity: 0.45; cursor: not-allowed; }
  button.ghost {
    font: inherit; font-size: 12px; cursor: pointer; color: var(--text-secondary);
    background: transparent; border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px;
  }
  button.ghost:hover { color: var(--text-primary); }
  button.gold { background: var(--gold); }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .plan-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .day-card {
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
    background: var(--page); cursor: pointer; min-height: 74px; transition: border-color .15s;
  }
  .day-card:hover { border-color: var(--accent); }
  .day-card .dow { font-size: 11px; color: var(--text-muted); }
  .day-card .tname { font-size: 13px; font-weight: 600; margin-top: 2px; }
  .day-card .tload { font-size: 11px; color: var(--text-secondary); }
  .day-card.empty .tname { color: var(--text-muted); font-weight: 400; }
  .day-card.running { border-color: var(--warn); }
  .day-card.done { opacity: 0.65; }

  .log { margin-top: 10px; }
  .log-entry {
    font-size: 13px; padding: 7px 10px; border-left: 3px solid var(--accent);
    background: var(--page); border-radius: 4px; margin-bottom: 6px;
  }
  .log-entry.bad { border-left-color: var(--bad); }
  .log-entry.good { border-left-color: var(--good); }
  .log-entry .ev { color: var(--text-secondary); font-size: 12px; }
  .log-entry .ev.exec { color: var(--text); border-left: 3px solid var(--accent); padding-left: 8px; }
  .chip {
    display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px;
    background: var(--surface-1); border: 1px solid var(--border); color: var(--text-secondary);
    margin: 2px 4px 0 0; font-variant-numeric: tabular-nums;
  }
  .chip.pos { color: var(--good); border-color: var(--good); }
  .chip.neg { color: var(--bad); border-color: var(--bad); }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 8px; }
  .tile { background: var(--page); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; }
  .tile .label { font-size: 11px; color: var(--text-secondary); }
  .tile .value { font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tile .unit { font-size: 11px; color: var(--text-muted); font-weight: 400; }

  .bar-row { display: grid; grid-template-columns: 62px 1fr 46px; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 13px; }
  .bar-row .name { color: var(--text-secondary); }
  .bar-row .track { height: 8px; border-radius: 99px; background: var(--grid); overflow: hidden; }
  .bar-row .fill { height: 100%; border-radius: 99px; background: var(--accent); transition: width .3s; }
  .bar-row .val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .bar-row.mood .fill { background: var(--good); }
  .bar-row.fatigue .fill { background: var(--warn); }
  .bar-row.fatigue.high .fill { background: var(--bad); }

  canvas { display: block; width: 100%; }
  .chart-note { font-size: 12px; color: var(--text-muted); margin-top: 6px; }

  .kb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
  .kb-card {
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 13px;
    background: var(--page); cursor: default;
  }
  .kb-card.unlocked { cursor: pointer; }
  .kb-card.unlocked:hover { border-color: var(--accent); }
  .kb-card .tag { font-size: 10px; color: var(--accent); letter-spacing: .04em; }
  .kb-card .title { font-weight: 600; margin: 2px 0; }
  .kb-card.locked .title, .kb-card.locked .tag { color: var(--text-muted); }
  .filter-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .filter-row button {
    font: inherit; font-size: 12px; padding: 4px 12px; border-radius: 999px; cursor: pointer;
    background: var(--page); color: var(--text-secondary); border: 1px solid var(--border);
  }
  .filter-row button.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .hist-item { padding: 9px 4px; border-bottom: 1px solid var(--grid); font-size: 13px; display: flex; gap: 12px; flex-wrap: wrap; align-items: baseline; }
  .hist-item:last-child { border-bottom: none; }
  .hist-item .t { font-weight: 600; }
  .hist-item .d { color: var(--text-muted); font-size: 12px; }
  .empty { color: var(--text-muted); font-size: 13px; padding: 10px 4px; }

  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 50;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .modal {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px;
    max-width: 560px; width: 100%; max-height: 88vh; overflow-y: auto; padding: 20px;
    box-shadow: 0 12px 48px rgba(0,0,0,0.28);
  }
  .modal .m-icon { font-size: 34px; line-height: 1; }
  .modal h3 { margin: 6px 0 8px; font-size: 17px; }
  .modal p { margin: 0 0 12px; font-size: 14px; color: var(--text-secondary); }
  .opt-btn {
    display: block; width: 100%; text-align: left; margin-bottom: 8px;
    font: inherit; font-size: 13.5px; cursor: pointer; color: var(--text-primary);
    background: var(--page); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
  }
  .opt-btn:hover { border-color: var(--accent); }
  .opt-btn[disabled] { opacity: .6; cursor: default; }
  .opt-btn.correct { border-color: var(--good); }
  .opt-btn.wrong { border-color: var(--bad); }
  .after-box { font-size: 13px; color: var(--text-secondary); background: var(--page); border-radius: 8px; padding: 10px 12px; margin: 8px 0; }
  .after-box b { color: var(--text-primary); }
  .kb-pop { border: 1px solid var(--accent); background: var(--page); border-radius: 8px; padding: 10px 12px; margin: 8px 0; font-size: 13px; }
  .kb-pop .kbt { font-weight: 600; color: var(--accent); font-size: 12px; margin-bottom: 4px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
  .splits { font-size: 12px; color: var(--text-secondary); font-variant-numeric: tabular-nums; max-height: 130px; overflow-y: auto; margin: 6px 0; }
  .race-bar { height: 10px; background: var(--grid); border-radius: 99px; overflow: hidden; margin: 10px 0; }
  .race-bar .fill { height: 100%; width: 0; background: var(--accent); transition: width .15s; }

  .toast-wrap { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 80; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
  .toast {
    background: var(--text-primary); color: var(--page); font-size: 12.5px; padding: 8px 16px;
    border-radius: 999px; box-shadow: 0 6px 24px rgba(0,0,0,0.25); animation: toastIn .2s ease-out;
    max-width: 88vw;
  }
  @keyframes toastIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* 选择判定：最优 / 代价 */
  .verdict { border-radius: 10px; padding: 10px 12px; margin: 10px 0 8px; font-size: 13px; animation: verdictPop .32s ease-out; }
  .verdict .v-title { font-weight: 700; font-size: 13.5px; }
  .verdict.best { background: rgba(67, 181, 129, .12); border: 1px solid var(--good); }
  .verdict.cost { background: rgba(224, 93, 93, .12); border: 1px solid var(--bad); }
  .verdict.ok { background: rgba(240, 173, 78, .12); border: 1px solid var(--warn); }
  .verdict .cost-chips { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 5px; }
  .verdict .cost-chips span { padding: 2px 8px; border-radius: 99px; background: rgba(224, 93, 93, .14); color: var(--bad); font-size: 12px; }
  .verdict.ok .cost-chips span { background: rgba(240, 173, 78, .16); color: var(--warn); }
  .verdict .v-best { margin-top: 6px; font-size: 12.5px; color: var(--text-secondary); }
  .verdict .v-best b { color: var(--accent); }
  @keyframes verdictPop { from { transform: scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }

  /* 周身体反馈弹窗 */
  .body-wrap { display: flex; gap: 14px; align-items: center; margin: 8px 0 4px; flex-wrap: wrap; }
  .body-col { flex: 0 0 136px; display: flex; flex-direction: column; align-items: center; }
  .body-svg { width: 136px; height: 210px; animation: bodyBreathe 3.2s ease-in-out infinite; }
  .body-svg .p { fill: var(--text-muted); opacity: .35; stroke: var(--surface-1); stroke-width: .8; transition: fill .3s, opacity .3s; }
  .body-svg .p.bad { fill: var(--bad); animation: partPulseBad 1.15s ease-in-out infinite; }
  .body-svg .p.good { fill: var(--good); animation: partPulseGood 1.6s ease-in-out infinite; }
  .body-bubble {
    max-width: 140px; margin-top: 4px; padding: 6px 10px; border-radius: 12px; font-size: 11.5px;
    background: var(--page); border: 1px solid var(--border); color: var(--text-primary); text-align: center;
    animation: bubbleIn .45s ease-out;
  }
  .body-bubble.bad { border-color: var(--bad); }
  .body-bubble.good { border-color: var(--good); }
  .body-note { flex: 1 1 190px; min-width: 170px; }
  .body-note .row { display: flex; gap: 8px; align-items: flex-start; margin: 7px 0; font-size: 12.5px; color: var(--text-secondary); }
  .body-note .row b { color: var(--text-primary); }
  .body-note .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex: 0 0 8px; }
  .body-note .dot.bad { background: var(--bad); box-shadow: 0 0 9px var(--bad); animation: dotBlink 1.15s ease-in-out infinite; }
  .body-note .dot.good { background: var(--good); box-shadow: 0 0 9px var(--good); animation: dotBlink 1.6s ease-in-out infinite; }
  @keyframes bodyBreathe { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  @keyframes partPulseBad {
    0%,100% { opacity: .55; filter: drop-shadow(0 0 2px var(--bad)); }
    50% { opacity: 1; filter: drop-shadow(0 0 9px var(--bad)); }
  }
  @keyframes partPulseGood {
    0%,100% { opacity: .6; filter: drop-shadow(0 0 2px var(--good)); }
    50% { opacity: 1; filter: drop-shadow(0 0 9px var(--good)); }
  }
  @keyframes bubbleIn { from { opacity: 0; transform: translateY(4px) scale(.96); } to { opacity: 1; transform: none; } }
  @keyframes dotBlink { 0%,100% { opacity: .5; } 50% { opacity: 1; } }

  .hidden { display: none !important; }
  footer { margin-top: 24px; color: var(--text-muted); font-size: 12px; }
  code { background: var(--page); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-size: 12px; }

  @media (max-width: 600px) {
    .wrap { padding: 14px 12px 64px; }
    .plan-grid { grid-template-columns: repeat(2, 1fr); }
    .bar-row { grid-template-columns: 54px 1fr 42px; }
    .modal { padding: 16px; border-radius: 12px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hd-top">
      <h1>领跑人生</h1>
      <span style="color:var(--text-muted);font-size:13px;">Pace for Life</span>
    </div>
    <div class="sub">扮演教练，从新手跑者练到全马完赛——在每个选择里学会科学运动</div>
    <div class="badges" id="badges"></div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-tab="week" class="active">训练周</button>
    <button data-tab="athlete">运动员</button>
    <button data-tab="kb">知识图鉴</button>
    <button data-tab="history">记录</button>
  </nav>

  <main>
    <section id="tab-week">
      <div class="card">
        <h2>训练周 <span class="hint" id="week-hint">点选每一天安排训练</span></h2>
        <div class="plan-grid" id="plan-grid"></div>
        <div class="toolbar">
          <button class="ghost" id="btn-recommend">推荐计划</button>
          <button class="primary" id="btn-start">开始本周</button>
          <button class="ghost hidden" id="btn-race">上周复盘</button>
          <button class="ghost" id="btn-new">新开档</button>
        </div>
        <div class="log" id="week-log"></div>
      </div>
    </section>

    <section id="tab-athlete" class="hidden">
      <div class="card">
        <h2>运动员状态</h2>
        <div class="tiles" id="athlete-tiles"></div>
        <div id="attr-bars"></div>
        <div id="injury-card"></div>
      </div>
      <div class="card">
        <h2>负荷管理 <span class="hint">急性负荷 vs 慢性负荷（ACWR）</span></h2>
        <canvas id="load-chart" height="180"></canvas>
        <div class="chart-note" id="chart-note"></div>
      </div>
    </section>

    <section id="tab-kb" class="hidden">
      <div class="card">
        <h2>知识图鉴 <span class="hint" id="kb-hint"></span></h2>
        <div class="filter-row" id="kb-filters"></div>
        <div class="kb-grid" id="kb-grid"></div>
      </div>
    </section>

    <section id="tab-history" class="hidden">
      <div class="card">
        <h2>记录 <span class="hint">比赛成绩与阶段达成</span></h2>
        <div id="history-list"></div>
      </div>
    </section>
  </main>

  <footer>
    存档保存在浏览器 localStorage（<code>sports_coach_save_v1</code>），知识图鉴跨周目保留。<br>
    本游戏内容为运动科学普及，不构成医疗建议；出现持续疼痛请就医。
  </footer>
</div>

<div class="overlay hidden" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast-wrap" id="toast-wrap"></div>

<script>
'use strict';
// ============================================================
// 1. 数据层 DATA
// ============================================================

const SAVE_KEY = 'sports_coach_save_v1';
const KB_KEY = 'sports_coach_kb_v1';
const DOW = ['周一','周二','周三','周四','周五','周六','周日'];

const STAGES = [
  { title:'新手跑者', icon:'🌱', longKm:5,
    race:{ km:5, target:35*60, label:'5K 测试赛', need:{endurance:35} } },
  { title:'5km 完赛者', icon:'🏃', longKm:8,
    race:{ km:10, target:72*60, label:'10K 测试赛', need:{endurance:48, speed:36} } },
  { title:'10km 挑战者', icon:'🔟', longKm:12,
    race:{ km:21.0975, target:2*3600+20*60, label:'半程马拉松', need:{endurance:65} } },
  { title:'半马跑者', icon:'🏅', longKm:25,
    race:{ km:42.195, target:4*3600+30*60, label:'全程马拉松', need:{endurance:85, technique:55} } },
  { title:'全马跑者', icon:'🏆', longKm:35, race:null },
];

const TRAINING_TYPES = [
  { id:'rest', name:'完全休息', icon:'😴', load:0, minStage:0, run:false, gains:{},
    desc:'睡好、放松，让身体完成超量恢复', tip:'kb_sleep' },
  { id:'stretch', name:'拉伸/瑜伽', icon:'🧘', load:5, minStage:0, run:false, gains:{flexibility:4},
    desc:'动态热身 + 静态拉伸，降低受伤风险', tip:'kb_warmup' },
  { id:'easyRun', name:'轻松跑', icon:'🏃', load:18, minStage:0, run:true, gains:{endurance:3, technique:2},
    desc:'能边跑边说话的配速，打有氧基础', tip:'kb_pace' },
  { id:'core', name:'核心训练', icon:'🧱', load:12, minStage:0, run:false, gains:{technique:4, strength:1},
    desc:'平板支撑、臀桥，稳定跑姿', tip:'kb_cadence' },
  { id:'strengthBody', name:'徒手力量', icon:'💪', load:20, minStage:0, run:false, gains:{strength:4},
    desc:'深蹲/箭步蹲/俯卧撑，给关节上护甲', tip:'kb_48h' },
  { id:'longRun', name:'长距离跑', icon:'🛣️', load:30, minStage:1, run:true, gains:{endurance:5},
    desc:'慢而长，提升耐力上限', tip:'kb_carb' },
  { id:'tempo', name:'乳酸门槛跑', icon:'🔥', load:26, minStage:1, run:true, gains:{endurance:2, speed:4},
    desc:'略快于舒适区的持续跑，推迟乳酸堆积', tip:'kb_lactate' },
  { id:'cross', name:'交叉训练', icon:'🚴', load:15, minStage:1, run:false, gains:{endurance:1, flexibility:1},
    desc:'游泳/骑行，低冲击维持体能', tip:'kb_cross' },
  { id:'interval', name:'间歇跑', icon:'⚡', load:32, minStage:2, run:true, gains:{speed:6, endurance:1},
    desc:'400m×8 冲刺 + 充分组间休息，提升 VO2max', tip:'kb_vo2' },
  { id:'strengthBarbell', name:'杠铃力量', icon:'🏋️', load:28, minStage:2, run:false, gains:{strength:5, technique:2},
    desc:'深蹲/硬拉，渐进超负荷提升跑力', tip:'kb_strength' },
];
const TRAINING_BY_ID = Object.fromEntries(TRAINING_TYPES.map(t => [t.id, t]));

const KB_TAGS = ['训练','负荷与恢复','损伤防护','营养与环境','综合'];
const KNOWLEDGE = [
  { id:'kb_pace', tag:'训练', title:'配速分级',
    content:'轻松跑（E）：能边跑边说话，占周跑量 70-80%；马拉松配速（M）；门槛跑（T）：略快于舒适区，20-40 分钟；间歇跑（I）：接近最大摄氧，短间歇。业余跑者 80% 的跑量应该是轻松的——练太狠是进步慢的常见原因。' },
  { id:'kb_warmup', tag:'损伤防护', title:'动态热身 vs 静态拉伸',

// ============================================================
// 2. 状态层 STATE
// ============================================================

let state = null;
let eventRisk = 0; // 当日事件带来的额外受伤风险

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const avg = arr => arr.length ? arr.reduce((s, v) => s + v, 0) / arr.length : 0;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

function defaultState() {
  return {
    version: 1,
    week: 1, day: 1, stage: 0, running: false,
    athlete: {
      endurance: 20, speed: 20, strength: 15, flexibility: 15, technique: 15,
      fatigue: 0, mood: 70, weight: 68, injury: null,
    },
    weekPlan: [null, null, null, null, null, null, null],
    weekLog: [], weekLoad: 0, weekEventsUsed: [], weekExecUsed: [],
    loadHistory: [],
    unlockedKnowledge: loadKbStore(),
    history: [],
    sleepBad: false,
    lastSummary: null,
    _yesterday: null,
  };
}

function loadKbStore() {
  try {
    const raw = localStorage.getItem(KB_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr.filter(id => KB_BY_ID[id]) : [];
  } catch (e) { return []; }
}

function save() {
  if (!state || state.running) return; // 周中不落盘，避免读到不一致状态
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
}

function loadState() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s || s.version !== 1 || !s.athlete) return null;
    if (!Array.isArray(s.weekPlan) || s.weekPlan.length !== 7) s.weekPlan = [null, null, null, null, null, null, null];
    if (!Array.isArray(s.loadHistory)) s.loadHistory = [];
    if (!Array.isArray(s.history)) s.history = [];
    if (!Array.isArray(s.unlockedKnowledge)) s.unlockedKnowledge = loadKbStore();
    if (!Array.isArray(s.weekEventsUsed)) s.weekEventsUsed = [];
    if (!Array.isArray(s.weekExecUsed)) s.weekExecUsed = [];
    s.running = false;
    s._yesterday = null;
    return s;
  } catch (e) { return null; }
}

function unlockKb(id) {
  if (!id || !KB_BY_ID[id]) return false;
  if (state.unlockedKnowledge.includes(id)) return false;
  state.unlockedKnowledge.push(id);
  try { localStorage.setItem(KB_KEY, JSON.stringify(state.unlockedKnowledge)); } catch (e) { /* ignore */ }
  return true;
}

// ============================================================
// 3. 逻辑层 CORE
// ============================================================

function chronicLoad() {
  const last = state.loadHistory.slice(-4);
  return Math.max(60, avg(last));
}
function currentAcwr() {
  const chronic = chronicLoad();
  return (state.weekLoad + (state.running ? 0 : 0)) / chronic;
}

const GAIN_SCALE = 0.30; // 全局成长节奏旋钮：让属性在 40-60 周内自然逼近上限

function calcGain(base, attr, a, running) {
  let g = base * GAIN_SCALE * (1 - attr / 120);
  g *= a.mood >= 70 ? 1.1 : (a.mood >= 40 ? 1.0 : 0.8);
  g *= clamp(1 - a.fatigue / 150, 0.3, 1);
  if (running) g *= clamp(68 / a.weight, 0.85, 1.15);
  return g;
}

function injuryRisk(extra) {
  const a = state.athlete;
  const acwr = state.weekLoad / chronicLoad();
  let risk = extra || 0;
  const threshold = 60 + state.stage * 4;
  if (a.fatigue > threshold) risk += (a.fatigue - threshold) * 0.004;
  if (acwr > 1.3) risk += (acwr - 1.3) * 0.15;
  if (a.flexibility < 30) risk += 0.01;
  return risk;
}

function pickEvent(ctx, used) {
  const pool = EVENTS.filter(e =>
    e.minStage <= state.stage && !used.includes(e.id) && (!e.cond || e.cond(ctx)));
  if (!pool.length) return null;
  let r = Math.random() * pool.reduce((s, e) => s + e.weight, 0);
  for (const e of pool) { r -= e.weight; if (r <= 0) return e; }
  return pool[pool.length - 1];
}

// 执行情境题：按当天训练类型抽题，每周不重复
function pickExec(t) {
  const ctx = { training: t, weekLoad: state.weekLoad, athlete: state.athlete };
  const pool = EXEC_QUESTIONS.filter(q =>
    q.train.includes(t.id) && !state.weekExecUsed.includes(q.id) && (!q.cond || q.cond(ctx)));
  if (!pool.length) return null;
  let r = Math.random() * pool.reduce((s, q) => s + q.weight, 0);
  for (const q of pool) { r -= q.weight; if (r <= 0) return q; }
  return pool[pool.length - 1];
}

function applyFx(opt) {
  const a = state.athlete;
  eventRisk += opt.risk || 0;
  if (opt.sleepBad) state.sleepBad = true;
  for (const [k, v] of Object.entries(opt.fx || {})) {
    if (k === 'fatigue') a.fatigue = clamp(a.fatigue + v, 0, 100);
    else if (k === 'weight') a.weight = clamp(a.weight + v, 45, 110);
    else if (k === 'mood') a.mood = clamp(a.mood + v, 0, 100);
    else if (typeof a[k] === 'number') a[k] = clamp(a[k] + v, 0, 100);
  }
}

// 结算一天。choiceFn(event) 返回选项索引（可为 Promise），debug 模式用自动选择。
async function resolveDayCore(day, choiceFn) {
  const a = state.athlete;
  eventRisk = 0;

  const planned = TRAINING_BY_ID[state.weekPlan[day - 1]] || TRAINING_BY_ID.rest;
  let t = planned;
  const notes = [];
  if (a.injury && t.load > 15) {
    t = TRAINING_BY_ID.rest;
    notes.push(`受伤恢复期：${planned.name} → 完全休息`);
  }

  // 1) 训练收益 + 疲劳累积
  const gains = {};
  for (const [k, base] of Object.entries(t.gains)) {
    const g = calcGain(base, a[k], a, t.run);
    a[k] = clamp(a[k] + g, 0, 100);
    gains[k] = g;
  }
  a.fatigue = clamp(a.fatigue + t.load * 1.15 * (1 - a.endurance / 250), 0, 100);
  if (t.id === 'rest') a.fatigue = Math.max(0, a.fatigue - 8);
  if (t.id === 'stretch') a.fatigue = Math.max(0, a.fatigue - 2);
  state.weekLoad += t.load;

  // 2) 单调训练惩罚
  const y = state._yesterday;
  if (y && t.id === y.id && t.load > 0) a.mood = clamp(a.mood - 5, 0, 100);

  // 3) 训练执行情境（按训练类型出题，模拟执行中的真实决策）
  let execInfo = null;
  if (Math.random() < 0.72) {
    const q = pickExec(t);
    if (q) {
      state.weekExecUsed.push(q.id);
      const idx = await choiceFn(q, { kind: 'exec', training: t });
      const opt = q.options[Math.max(0, Math.min(Number(idx) || 0, q.options.length - 1))];
      applyFx(opt);
      const isNewKb = opt.kb ? unlockKb(opt.kb) : false;
      execInfo = {
        title: q.title, icon: q.icon, optionLabel: opt.label, after: opt.after,
        kb: opt.kb || null, isNewKb, correct: opt.correct, risk: opt.risk || 0,
      };
    }
  }

  // 4) 随机事件（当天已有执行情境题时降低概率，避免连续弹窗）
  let evInfo = null;
  if (Math.random() < (execInfo ? 0.28 : 0.5)) {
    const ctx = {
      training: t, yesterdayTraining: y || null,
      acuteLoad: state.weekLoad, chronicLoad: chronicLoad(),
    };
    const ev = pickEvent(ctx, state.weekEventsUsed);
    if (ev) {
      state.weekEventsUsed.push(ev.id);
      const idx = await choiceFn(ev);
      const opt = ev.options[Math.max(0, Math.min(Number(idx) || 0, ev.options.length - 1))];
      applyFx(opt);
      const isNewKb = opt.kb ? unlockKb(opt.kb) : false;
      evInfo = {
        title: ev.title, icon: ev.icon, optionLabel: opt.label, after: opt.after,
        kb: opt.kb || null, isNewKb, risk: opt.risk || 0, correct: opt.correct,
      };
    }
  }

  // 4) 每日恢复
  const sleepGood = !state.sleepBad;
  const recovery = 6 + (sleepGood ? 4 : 0) + (t.load === 0 ? 8 : 0)
    + a.flexibility / 40 + a.strength / 50 + (t.id === 'stretch' ? 2 : 0);
  a.fatigue = clamp(a.fatigue - recovery, 0, 100);
  state.sleepBad = false;

  // 5) 心情：高疲劳惩罚
  if (a.fatigue > 80) a.mood = clamp(a.mood - 3, 0, 100);

  // 6) 伤病倒计时 / 受伤判定
  let injuryNote = null;
  if (a.injury) {
    a.injury.daysLeft -= 1;
    a.mood = clamp(a.mood - 1, 0, 100);
    if (a.injury.daysLeft <= 0) {
      injuryNote = `伤愈复出（${a.injury.part}）`;
      a.injury = null;
    }
  } else {
    const risk = injuryRisk(eventRisk);
    if (risk > 0 && Math.random() < risk) {
      const severe = risk >= 0.20;
      const part = pick(['脚踝', '膝盖', '小腿胫骨', '足底筋膜', '大腿后侧腘绳肌', '腰部']);
      const days = severe ? 14 + Math.floor(Math.random() * 8) : 3 + Math.floor(Math.random() * 5);
      a.injury = { part, daysLeft: days, severe };
      a.mood = clamp(a.mood - 6, 0, 100);
      injuryNote = `受伤！${part}${severe ? '（重伤）' : '（轻伤）'}，需要休养 ${days} 天`;
    }
  }

  state._yesterday = t;
  const entry = {
    day, trainId: t.id, trainName: t.name, icon: t.icon, load: t.load,
    gains, notes, exec: execInfo, event: evInfo, injuryNote,
  };
  state.weekLog.push(entry);
  state.day = day + 1;
  return entry;
}

function weekWrapUp() {
  const a = state.athlete;
  const log = state.weekLog.slice();
  let aerobic = 0, strength = 0;
  for (const e of log) {
    const t = TRAINING_BY_ID[e.trainId];
    if (!t) continue;
    if (t.run || t.id === 'cross') aerobic += t.load;
    if (t.id === 'strengthBody' || t.id === 'strengthBarbell' || t.id === 'core') strength += t.load;
  }
  if (aerobic >= 80) a.weight = clamp(a.weight - 0.3, 45, 110);
  if (strength >= 60) a.weight = clamp(a.weight + 0.2, 45, 110);
  if (log.length === 7) a.mood = clamp(a.mood + 3, 0, 100);

  state.loadHistory.push(state.weekLoad);
  const summary = { week: state.week, load: state.weekLoad, log, advice: [] };
  const execLogs = log.filter(e => e.exec);
  summary.exec = {
    total: execLogs.length,
    correct: execLogs.filter(e => e.exec.correct === true).length,
  };
  summary.advice = coachAdvice(summary);

  state.lastSummary = summary;
  state.weekLog = [];
  state.weekLoad = 0;
  state.weekEventsUsed = [];
  state.weekExecUsed = [];
  state._yesterday = null;
  state.running = false;
  state.week += 1;
  state.day = 1;
  return summary;
}

function coachAdvice(summary) {
  const a = state.athlete;
  const tips = [];
  const lh = state.loadHistory;
  const acute = lh[lh.length - 1] || 0;
  const prev = lh.slice(-5, -1);
  const chronic = prev.length ? avg(prev) : acute;
  const acwr = chronic > 0 ? acute / chronic : 1;

  if (acwr > 1.3) {
    tips.push({ lvl: 'bad', text: `本周负荷 ${Math.round(acute)}，比近几周平均高 ${Math.round((acwr - 1) * 100)}%——已进入受伤高危区（ACWR > 1.3）。下周建议减量 20-30%。`, kb: 'kb_acwr' });
  } else if (acwr < 0.8 && lh.length >= 3) {
    tips.push({ lvl: 'warn', text: '本周是减量周，有利于恢复——但连续两周负荷过低会让体能下滑。', kb: 'kb_acwr' });
  }
  if (a.fatigue > 70) {
    tips.push({ lvl: 'bad', text: `疲劳 ${Math.round(a.fatigue)} 偏高，下周至少安排 2 个休息/拉伸日。`, kb: 'kb_sleep' });
  }
  if (a.mood < 40) {
    tips.push({ lvl: 'warn', text: '心情低落。连续高强度或单一日程会消耗动力，试试交叉训练或和朋友一起跑。', kb: 'kb_variety' });
  }
  const types = new Set(summary.log.map(e => e.trainId));
  if (types.size <= 2) {
    tips.push({ lvl: 'warn', text: '本周训练种类太少，长期单项训练会进步更慢，也更容易受伤。', kb: 'kb_variety' });
  }
  if (a.injury) {
    tips.push({ lvl: 'bad', text: `${a.injury.part}受伤中，剩 ${a.injury.daysLeft} 天。恢复期只安排休息/拉伸/交叉训练。`, kb: 'kb_rice' });
  }
  const race = STAGES[state.stage].race;
  if (race) {
    const needOk = Object.entries(race.need).every(([k, v]) => a[k] >= v);
    if (needOk && !a.injury) {
      tips.push({ lvl: 'good', text: `能力已达到 ${race.label} 参赛门槛。建议先安排一个减量周再报名比赛日——赛前减量能让成绩明显更好。`, kb: 'kb_taper' });
    }
  }
  if (!tips.length) {
    tips.push({ lvl: 'good', text: '本周安排均衡，负荷平稳。保持节奏，慢慢变强。', kb: null });
  }
  return tips;
}

// ---- 比赛 ----
function raceNeedsOk() {
  const race = STAGES[state.stage].race;
  if (!race) return false;
  return Object.entries(race.need).every(([k, v]) => state.athlete[k] >= v);
}
function raceReady() {
  return STAGES[state.stage].race && raceNeedsOk() && !state.athlete.injury;
}

function isTapered() {
  const lh = state.loadHistory;
  if (lh.length < 2) return false;
  const last = lh[lh.length - 1];
  const prev = lh.slice(-4, -1);
  return last < avg(prev) * 0.85;
}

function simulateRace() {
  const race = STAGES[state.stage].race;
  if (!race) return null;
  const a = state.athlete;
  const taper = isTapered();
  const basePace = 560
    * (1 - a.endurance / 400 - a.speed / 500 - a.technique / 500)
    * (1 + 0.25 * (race.km / 42.195) * (1 - a.endurance / 100))
    * (1 + a.fatigue / 250)
    * (a.mood < 40 ? 1.03 : 1)
    * (1 + (a.weight - 62) / 300)
    * (taper ? 0.98 : 1);

  const splits = [];
  let total = 0;
  const wholeKms = Math.ceil(race.km);
  for (let km = 1; km <= wholeKms; km++) {
    const d = Math.min(1, race.km - (km - 1));
    const pace = basePace * (0.98 + Math.random() * 0.04);
    total += pace * d;
    splits.push({ km, time: total, pace });
  }
  const pass = total <= race.target;
  return { race, total, pass, splits, taper };
}

function applyStageUp() {
  const a = state.athlete;
  state.stage = Math.min(STAGES.length - 1, state.stage + 1);
  a.mood = clamp(a.mood + 10, 0, 100);
  const week = state.lastSummary ? state.lastSummary.week : state.week - 1;
  state.history.push({ type: 'stage', week, stage: state.stage, title: STAGES[state.stage].title });
}

function unlockedAt(stage) {
  return TRAINING_TYPES.filter(t => t.minStage === stage);
}

function fmtTime(sec) {
  sec = Math.round(sec);
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const mm = String(m).padStart(h ? 2 : 1, '0');
  const ss = String(s).padStart(2, '0');
  return h ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}
function fmtPace(secPerKm) {
  return fmtTime(Math.round(secPerKm)) + '/km';
}

function recommendPlan() {
  if (state.running) return;

// 有唯一正确答案的题给出判定：最优 → 恭喜；非最优 → 列出代价并揭示更优解
function optionVerdict(o, ev) {
  if (!ev.options.some(x => x.correct === true)) return null;
  if (o.correct === true) return { kind: 'best', title: '🎉 恭喜，这是最优选择！', chips: [] };
  const f = o.fx || {};
  const chips = [];
  if (o.sleepBad) chips.push('当晚睡眠恢复 −4');
  if (f.fatigue > 0) chips.push(`疲劳 +${f.fatigue}`);
  if (f.mood < 0) chips.push(`心情 ${f.mood}`);
  if (f.weight > 0) chips.push(`体重 +${f.weight.toFixed(1)}kg`);
  ['endurance', 'speed', 'strength', 'flexibility', 'technique'].forEach(k => {
    if (f[k] < 0) chips.push(`${ATTR_NAME[k]} ${f[k]}`);
  });
  if (o.risk) chips.push(`当日受伤风险 +${Math.round(o.risk * 100)}%`);
  const costly = o.sleepBad || o.risk || f.fatigue > 0 || f.mood < 0 || f.weight > 0
    || ['endurance', 'speed', 'strength', 'flexibility', 'technique'].some(k => f[k] < 0);
  if (costly) return { kind: 'cost', title: '⚠️ 这不是最优选择，代价是：', chips };
  if (Object.values(f).some(v => v > 0)) {
    return { kind: 'ok', title: '✅ 稳妥的选择，但还有更优解。', chips: [] };
  }
  return { kind: 'cost', title: '⚠️ 执行质量打了折扣', chips: ['这次训练没有获得额外收益'] };
}

function eventChoiceUI(ev, meta) {
  const isExec = !!(meta && meta.kind === 'exec');
  return new Promise(resolve => {
    const m = openModal(`
      ${isExec ? `<div style="font-size:12px;color:var(--text-secondary);margin-bottom:4px">
        训练执行中 · ${meta.training.icon} ${meta.training.name}</div>` : ''}
      <div class="m-icon">${isExec ? '🧭' : ev.icon}</div>
      <h3>${ev.title}</h3>
      ${isExec ? `<div class="race-bar"><div class="fill" id="exec-fill" style="transition:width .7s"></div></div>
        <div style="font-size:11px;color:var(--text-muted);text-align:right;margin-top:-4px" id="exec-pct">进度 0% · 热身中</div>` : ''}
      <p id="ev-text"${isExec ? ' style="opacity:0;transition:opacity .3s"' : ''}>${ev.text}</p>
      <div id="ev-opts"></div>`);
    const wrap = m.querySelector('#ev-opts');
    const fill = m.querySelector('#exec-fill');
    const pct = m.querySelector('#exec-pct');
    const text = m.querySelector('#ev-text');

    const mountOptions = () => {
      if (isExec) {
        text.style.opacity = '1';
        if (fill) fill.style.width = '55%';
        if (pct) pct.textContent = '进度 55% · 主训练中';
      }
      ev.options.forEach((o, i) => {
        const b = document.createElement('button');
        b.className = 'opt-btn';
        b.textContent = o.label;
        b.onclick = () => {
          Array.from(wrap.children).forEach(c => { c.disabled = true; });
          if ('correct' in o) b.classList.add(o.correct ? 'correct' : 'wrong');
          if (isExec) {
            if (fill) fill.style.width = '100%';
            if (pct) pct.textContent = '进度 100% · 完成';
          }
          const kb = o.kb ? KB_BY_ID[o.kb] : null;
          const verdict = optionVerdict(o, ev);
          const best = ev.options.find(x => x.correct === true);
          const verdictHtml = verdict ? `
            <div class="verdict ${verdict.kind}">
              <div class="v-title">${verdict.title}</div>
              ${verdict.chips.length ? `<div class="cost-chips">${verdict.chips.map(c => `<span>${c}</span>`).join('')}</div>` : ''}
              ${verdict.kind !== 'best' && best ? `<div class="v-best">更优解：<b>${best.label}</b></div>` : ''}
            </div>` : '';
          const extra = document.createElement('div');
          extra.innerHTML = `
            ${verdictHtml}
            <div class="after-box"><b>结果：</b>${o.after}</div>
            ${kb ? `<div class="kb-pop"><div class="kbt">📖 ${kb.title} · ${kb.tag}</div>${kb.content}</div>` : ''}
            <div class="modal-actions"><button class="primary" id="ev-continue">继续</button></div>`;
          m.appendChild(extra);
          m.querySelector('#ev-continue').onclick = () => { closeModal(); resolve(i); };
        };
        wrap.appendChild(b);
      });
    };

    if (isExec) setTimeout(mountOptions, 700);
    else mountOptions();
  });
}

function renderChart() {
  const canvas = $('#load-chart');
  if (!canvas || canvas.closest('.hidden')) return;
  const dpr = window.devicePixelRatio || 1;
  const W = Math.max(280, canvas.parentElement.clientWidth - 32);
  const H = 180;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const css = getComputedStyle(document.documentElement);
  const accent = css.getPropertyValue('--accent').trim();
  const warn = css.getPropertyValue('--warn').trim();
  const muted = css.getPropertyValue('--text-muted').trim();
  const grid = css.getPropertyValue('--grid').trim();

  if (!state.loadHistory.length) {
    ctx.fillStyle = muted;
    ctx.font = '13px system-ui';
    ctx.fillText('完成第一周训练后，这里会显示负荷曲线', 10, H / 2);
    return;
  }

  const loads = state.loadHistory.slice(-8);
  const chronicSeries = [];
  for (let i = state.loadHistory.length - loads.length; i < state.loadHistory.length; i++) {
    const slice = state.loadHistory.slice(Math.max(0, i - 3), i + 1);
    chronicSeries.push(avg(slice));
  }
  const maxY = Math.max(100, ...loads, ...chronicSeries) * 1.15;
  const padL = 34, padR = 10, padT = 12, padB = 22;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const n = loads.length;
  const x = i => padL + (n === 1 ? plotW / 2 : (i * plotW) / (n - 1));
  const y = v => padT + plotH - (v / maxY) * plotH;

  // 网格
  ctx.strokeStyle = grid; ctx.lineWidth = 1;
  for (let g = 0; g <= 2; g++) {
    const yy = padT + (plotH * g) / 2;
    ctx.beginPath(); ctx.moveTo(padL, yy); ctx.lineTo(W - padR, yy); ctx.stroke();
    ctx.fillStyle = muted; ctx.font = '10px system-ui'; ctx.textAlign = 'right';
    ctx.fillText(Math.round(maxY * (1 - g / 2)), padL - 6, yy + 3);
  }
  ctx.textAlign = 'left';

  // 负荷柱
  const barW = Math.max(6, Math.min(26, plotW / n / 2));
  loads.forEach((v, i) => {
    ctx.fillStyle = accent;
    ctx.globalAlpha = 0.75;
    ctx.fillRect(x(i) - barW / 2, y(v), barW, padT + plotH - y(v));
    ctx.globalAlpha = 1;
    ctx.fillStyle = muted; ctx.font = '10px system-ui'; ctx.textAlign = 'center';
    const wk = state.loadHistory.length - n + i + 1;
    ctx.fillText('W' + wk, x(i), H - 6);
  });

  // 慢性负荷线
  ctx.strokeStyle = warn; ctx.lineWidth = 2; ctx.beginPath();
  chronicSeries.forEach((v, i) => { i ? ctx.lineTo(x(i), y(v)) : ctx.moveTo(x(i), y(v)); });
  ctx.stroke();
  ctx.fillStyle = warn;
  chronicSeries.forEach((v, i) => {
    ctx.beginPath(); ctx.arc(x(i), y(v), 2.5, 0, Math.PI * 2); ctx.fill();
  });
  ctx.font = '10px system-ui'; ctx.textAlign = 'right';
  ctx.fillText('— 慢性负荷(4周均)', W - padR, padT + 2);

  const chronic = chronicLoad();
  const acwr = state.weekLoad / chronic;
  $('#chart-note').textContent = state.weekLoad === 0 && !state.running
    ? `本周尚未开始 · 慢性负荷（近 4 周均）${Math.round(chronic)}`
    : `当前周累计负荷 ${Math.round(state.weekLoad)} · 慢性负荷 ${Math.round(chronic)} · ACWR ${acwr.toFixed(2)}` +
      (acwr > 1.3 ? '（偏高，受伤风险↑）' : acwr < 0.8 ? '（偏低，恢复周）' : '（适宜区间）');
}

      <div style="font-size:12px;color:var(--text-muted)">${has ? k.content.slice(0, 38) + '…' : '完成相关训练或做出正确选择后解锁'}</div>
    </div>`;
  }).join('');
  $('#kb-grid').querySelectorAll('.kb-card').forEach(card => {
    card.onclick = () => {
      if (!card.dataset.kb) { toast('完成相关训练或事件后可解锁这张卡片'); return; }
      showKbCard(card.dataset.kb);
    };
  });
}

function showKbCard(id) {
  const k = KB_BY_ID[id];
  if (!k) return;
  const m = openModal(`
    <div class="m-icon">📖</div>
    <h3>${k.title}</h3>

// ---- 记录 ----
function renderHistory() {
  const el = $('#history-list');
  const rows = state.history.slice().reverse();
  if (!rows.length) { el.innerHTML = '<div class="empty">还没有比赛或升阶记录。完成训练、报名比赛日吧。</div>'; return; }
  el.innerHTML = rows.map(h => {
    if (h.type === 'stage') {
      return `<div class="hist-item"><span>🎖</span><span class="t">升阶：${h.title}</span>
        <span class="d">第 ${h.week} 周</span></div>`;
    }
    return `<div class="hist-item">
      <span>${h.pass ? '✅' : '❌'}</span>
      <span class="t">${h.label}</span>
      <span class="d">第 ${h.week} 周 · ${h.km.toFixed(1)} km</span>

    </div>`;

}

// ---- 周复盘 ----
function weeklyGainTotals(log) {
  const totals = {};
  for (const e of log) for (const [k, v] of Object.entries(e.gains)) totals[k] = (totals[k] || 0) + v;
  return totals;
}

async function reviewModal(summary) {
  const a = state.athlete;
  const stage = STAGES[state.stage];
  const canRace = !!(stage.race && raceNeedsOk() && !a.injury && !summary.raceDone);
  const totals = weeklyGainTotals(summary.log);
  const gainChips = Object.entries(totals).filter(([, v]) => v >= 0.05)
    .map(([k, v]) => `<span class="chip pos">${ATTR_NAME[k]} +${v.toFixed(1)}</span>`).join('');
  const tips = summary.advice.map((t, i) => `
    <div class="after-box" data-tip="${i}" style="border-left:3px solid var(--${t.lvl === 'bad' ? 'bad' : t.lvl === 'warn' ? 'warn' : 'good'})">
      ${t.text}
      ${t.kb ? `<a href="javascript:void(0)" class="kblink" data-tipkb="${i}" style="color:var(--accent);font-size:12px">📖 查看知识卡</a>` : ''}
    </div>`).join('');
  const logHtml = summary.log.map(entryHtml).join('');

  const m = openModal(`
    <div class="m-icon">📋</div>
    <h3>第 ${summary.week} 周复盘</h3>
    <p>本周总负荷 <b>${Math.round(summary.load)}</b>${gainChips ? ' · ' + gainChips : ''}</p>
    ${summary.exec && summary.exec.total ? `<p style="font-size:13px;color:var(--text-secondary)">
      🧭 执行阶段决策：<b>${summary.exec.correct} / ${summary.exec.total}</b> 次判断正确${summary.exec.correct === summary.exec.total ? ' · 完美执行！' : ''}</p>` : ''}
    ${tips}
    <details style="font-size:13px;margin:8px 0"><summary style="cursor:pointer;color:var(--text-secondary)">查看本周训练明细</summary><div class="log">${logHtml}</div></details>
    <div class="modal-actions">
      ${canRace ? `<button class="primary gold" id="rv-race">🏁 报名${stage.race.label}</button>` : ''}
      <button class="primary" id="rv-next">进入下一周</button>
    </div>`);

  m.querySelectorAll('.kblink').forEach(link => {
    link.onclick = () => {
      const t = summary.advice[Number(link.dataset.tipkb)];
      const tipEl = link.closest('.after-box');
      if (tipEl.querySelector('.kb-pop')) { tipEl.querySelector('.kb-pop').remove(); return; }
      const k = KB_BY_ID[t.kb];
      if (!k) return;
      const pop = document.createElement('div');
      pop.className = 'kb-pop';
      pop.innerHTML = `<div class="kbt">📖 ${k.title} · ${k.tag}</div>${k.content}`;
      tipEl.appendChild(pop);
    };
  });

  m.querySelector('#rv-next').onclick = () => {
    closeModal();
    renderAll();
    save();
  };
  const raceBtn = m.querySelector('#rv-race');
  if (raceBtn) {
    raceBtn.onclick = async () => {
      closeModal();
      await stateRaceFlow(summary);
    };
  }
}

// ---- 比赛日 ----
async function stateRaceFlow(summary) {
  const sim = simulateRace();
  if (!sim) return;
  const race = sim.race;
  const m = openModal(`
    <div class="m-icon">🏁</div>
    <h3>${race.label}</h3>
    <p>距离 ${race.km.toFixed(1)} km · 目标 ${fmtTime(race.target)}${sim.taper ? ' · 赛前减量生效' : ' · 未减量'}</p>
    <div class="race-bar"><div class="fill" id="race-fill"></div></div>
    <div class="splits" id="splits"></div>`);
  const fill = m.querySelector('#race-fill');
  const splitsEl = m.querySelector('#splits');
  const steps = 20;
  for (let i = 1; i <= steps; i++) {
    await sleep(60);
    fill.style.width = (i / steps * 100) + '%';
    const idx = Math.min(sim.splits.length - 1, Math.round((i / steps) * (sim.splits.length - 1)));
    splitsEl.innerHTML = sim.splits.slice(Math.max(0, idx - 3), idx + 1)
      .map(s => `第 ${s.km} km · ${fmtTime(s.time)} · ${fmtPace(s.pace)}`).join('<br>');
  }

  summary.raceDone = true;
  state.history.push({
    type: 'race', week: summary.week, label: race.label, km: race.km,
    time: sim.total, target: race.target, pass: sim.pass,
  });

  const a = state.athlete;
  const passed = sim.pass;
  let html = `
    <div class="m-icon">${passed ? '🎉' : '😣'}</div>
    <h3>${passed ? '达标！' : '未达标'}</h3>
    <p>完赛成绩 <b>${fmtTime(sim.total)}</b> · 目标 ${fmtTime(race.target)}
      ${passed ? '' : ` · 差 ${fmtTime(sim.total - race.target)}`}</p>`;
  if (!passed) {
    const reasons = [];
    if (a.fatigue > 40) reasons.push(`赛前疲劳偏高（${Math.round(a.fatigue)}）——下次赛前安排 1-2 周减量。`);
    if (!sim.taper) reasons.push('这次没有做赛前减量（taper），成绩受影响。');
    const missing = Object.entries(race.need).filter(([k, v]) => a[k] < v);
    if (missing.length) reasons.push(`基础能力还差一点：${missing.map(([k, v]) => `${ATTR_NAME[k]} ${a[k].toFixed(0)}/${v}`).join('，')}。`);
    if (!reasons.length) reasons.push('配速策略或状态还不够稳，再积累几周训练，先减量再来一次。');
    html += `<div class="after-box">${reasons.map(r => '· ' + r).join('<br>')}</div>
      <div class="kb-pop"><div class="kbt">📖 赛前减量（Taper）</div>${KB_BY_ID.kb_taper.content}</div>`;
  }
  html += `<div class="modal-actions"><button class="primary" id="race-continue">继续</button></div>`;
  m.innerHTML = html;

  m.querySelector('#race-continue').onclick = () => {
    const oldStage = state.stage;
    if (passed) applyStageUp();
    closeModal();
    renderAll();
    save();
    if (passed) showStageUpModal(oldStage);
  };
}

function showStageUpModal(oldStage) {
  const st = STAGES[state.stage];
  const unlocked = unlockedAt(state.stage);
  const unlockHtml = unlocked.length
    ? `<p>解锁新训练：${unlocked.map(t => `${t.icon} ${t.name}`).join('、')}</p>`
    : '';
  const nextRace = st.race
    ? `<p>下一关：${st.race.label} · 目标 ${fmtTime(st.race.target)}</p>`
    : `<p>你已经是全马跑者——恭喜通关！知识图鉴收集仍在继续。</p>`;
  const m = openModal(`
    <div class="m-icon">🎖️</div>
    <h3>升阶：${st.title}</h3>
    <p>你的运动员正式成为 <b>${st.title}</b>！心情 +10。</p>
    ${unlockHtml}${nextRace}
    <div class="modal-actions"><button class="primary" id="su-close">继续前行</button></div>`);
  m.querySelector('#su-close').onclick = () => {
    closeModal();
    renderAll();
    save();
  };
}

// ---- 周推进 ----
// ---- 周身体反馈：最后一次训练后的部位感受 ----
const BODY_REGION_LABEL = {
  knee: '膝盖', calf: '小腿', thigh: '大腿后侧', ankle: '脚踝',
  foot: '脚底', waist: '腰', hip: '髋部',
};
const INJURY_REGION = {
  '脚踝': 'ankle', '膝盖': 'knee', '小腿胫骨': 'calf',
  '足底筋膜': 'foot', '大腿后侧腘绳肌': 'thigh', '腰部': 'waist',
};
const RUN_IDS = ['easyRun', 'longRun', 'tempo', 'interval'];

function bodyFeedback(summary) {
  const a = state.athlete;
  const log = summary.log || [];
  const side = () => Math.random() < 0.5 ? 'L' : 'R';
  const runDays = log.filter(e => RUN_IDS.includes(e.trainId));
  const strengthDays = log.filter(e => ['strengthBody', 'strengthBarbell', 'core'].includes(e.trainId));
  const stretchDays = log.filter(e => e.trainId === 'stretch');
  const last = log[log.length - 1];
  const rows = [];
  let badCount = 0, goodCount = 0;
  const add = (ids, status, title, text, bubble) => {
    if (status === 'bad' && badCount >= 3) return;
    if (status === 'good' && goodCount >= 1) return;
    if (status === 'bad') badCount++; else goodCount++;
    rows.push({ ids, status, title, text, bubble: bubble || title });
  };

  // 1) 现有伤病优先
  if (a.injury) {
    const region = INJURY_REGION[a.injury.part] || 'knee';
    const label = BODY_REGION_LABEL[region] || '身体';
    add([region + side()], 'bad', `${a.injury.part}还没好`,
      `跑完最后一天，${a.injury.part}仍有${a.injury.severe ? '明显' : '轻微'}的不适。恢复期别急着上强度，先把炎症和负荷控制住。`,
      `${label}还在隐隐作痛…`);
  }

  // 2) 本周负荷涨太快 → 膝/小腿
  const prev = state.loadHistory.slice(0, -1).slice(-4);
  const chronic = Math.max(60, avg(prev));
  const acwr = summary.load / chronic;
  if (acwr > 1.3) {
    add(['kneeL', 'kneeR'], 'bad', '双膝有点发紧',
      `本周负荷比过去四周平均高 ${Math.round((acwr - 1) * 100)}%，膝关节多承担了一截冲击。下周先别再涨量，给身体适应的时间。`,
      '膝盖有点发紧，像被提醒了…');
  }

  // 3) 执行阶段的错误决策：风险、拉伸不到位、动作变形
  for (const e of log) {
    if (e.exec && e.exec.risk > 0) {
      const riskyRegion = RUN_IDS.includes(e.trainId) || e.trainId === 'strengthBody' || e.trainId === 'strengthBarbell' ? 'knee' : 'waist';
      add([riskyRegion + side()], 'bad', `${e.exec.title}留下了代价`,
        `${DOW[e.day - 1]}的「${e.exec.title}」你选了「${e.exec.optionLabel}」。${(e.exec.after || '').replace(/^[✓✗]\s*/, '')}`,
        `${BODY_REGION_LABEL[riskyRegion] || '身体'}有点不舒服…`);
    }
    if (e.exec && !e.exec.correct && /拉伸|瑜伽/.test(e.trainName)) {
      add(['thigh' + side(), 'hip'], 'bad', '大腿后侧偏紧',
        `这周的拉伸执行不到位（${e.exec.optionLabel}）。肌肉没完全放松，跑完会觉得后侧发紧。下次每个动作保持 20-30 秒，有牵拉感即可。`,
        '大腿后侧紧紧的…');
    }
    if (e.exec && !e.exec.correct && /膝内扣/.test(e.exec.title)) {
      add(['kneeL', 'kneeR'], 'bad', '膝盖不太舒服',
        '力量训练时膝盖内扣的负荷会在跑后显现。降重量、让膝盖对准脚尖，比硬撑重量更重要。',
        '膝盖内侧有点别扭…');
    }
  }

  // 4) 高疲劳 / 柔韧不足
  if (a.fatigue > 60) {
    add(['waist', 'calfL', 'calfR'], 'bad', '全身还没缓过来',
      `周末疲劳仍有 ${Math.round(a.fatigue)}。这不是受伤，是身体在说：睡眠、拉伸和轻松日不能省。`,
      '整个人沉沉的…');
  }
  if (a.flexibility < 30 && runDays.length >= 3 && stretchDays.length < 2) {
    add(['thighL', 'thighR', 'hip'], 'bad', '髋和大腿发紧',
      '柔韧属性偏低，跑量一上来就容易觉得髋部发紧。下周安排 1-2 次拉伸/瑜伽。',
      '髋部发紧…');
  }

  // 5) 正反馈：排除伤病的部位后，给「变强了」的感受
  const legBad = rows.some(r => r.status === 'bad' && r.ids.some(id => /thigh|calf|knee|ankle|foot/.test(id)));
  if (!a.injury && !legBad && runDays.length >= 2) {
    add(['thighL', 'thighR', 'calfL', 'calfR'], 'good', '腿部更有力了',
      `本周完成 ${runDays.length} 次跑步，负荷${acwr > 0.95 ? '稳步推进' : '控制得很稳'}。跑完最后一天，腿虽然累，但那种「能撑住」的感觉变强了。`,
      '我感觉自己变强了！');
  }
  if (!a.injury && strengthDays.length >= 2 && a.fatigue < 70) {
    add(['armL', 'armR', 'chest'], 'good', '上肢和核心更稳',
      '力量训练让摆臂和躯干稳定度提升，跑步时能量泄漏更少。',
      '核心和手臂更有劲了！');
  }
  if (!a.injury && stretchDays.length >= 2 && !legBad) {
    add(['hip'], 'good', '髋部更灵活',
      '规律拉伸让髋部活动度变好，步幅更自然。',
      '身体拉开了，很舒服！');
  }
  if (!rows.length) {
    if (a.fatigue < 40) {
      add(['chest', 'core'], 'good', '身体恢复得不错',
        '这周负荷平稳，最后一天结束时呼吸轻松、肌肉没有明显酸胀。科学训练的感觉正在形成。',
        '我感觉自己变强了！');
    } else {
      add(['waist'], 'bad', '腰背有点酸',
        '本周负荷不算高，但疲劳没有完全消化。下周多安排睡眠和轻松日。',
        '腰背有点酸…');
    }
  }

  const bad = rows.filter(r => r.status === 'bad');
  return { rows, bad, bubbleRow: bad[0] || rows[0], acwr, last, hasBad: bad.length > 0 };
}

function bodyCheckUI(summary) {
  const fb = bodyFeedback(summary);
  return new Promise(resolve => {
    const m = openModal(`
      <div style="font-size:12px;color:var(--text-secondary);margin-bottom:2px">
        第 ${summary.week} 周 · 最后一次训练：${fb.last ? `${DOW[fb.last.day - 1]} ${fb.last.icon} ${fb.last.trainName}` : '休息'}</div>
      <h3>${fb.hasBad ? '🧍 身体给你发来一条反馈' : '💪 身体感觉不错'}</h3>
      <p>${fb.hasBad
        ? '最后一天训练结束，你停下来感受身体——有些地方在提醒你，但它们还不是伤病，只是下一次该怎么练的线索。'
        : '最后一天训练结束，你停下来感受身体——呼吸平稳，肌肉有力量感，你感觉自己变强了。'}</p>
      <div class="body-wrap">

        </div>
        <div class="body-note">
          ${fb.rows.map(r => `<div class="row"><span class="dot ${r.status}"></span>
            <span><b>${r.title}</b><br>${r.text}</span></div>`).join('')}
        </div>
      </div>
      <div style="font-size:11px;color:var(--text-muted);margin-top:6px">身体反馈只是训练信号，不构成医疗建议；持续疼痛请就医。</div>
      <div class="modal-actions"><button class="primary" id="body-ok">我记住了</button></div>`);

async function runWeekUI() {
  if (state.running) return;
  if (state.weekPlan.some(x => !x)) { toast('请先把 7 天都安排上训练'); return; }
  state.running = true;
  state.day = 1;
  state.weekLog = [];
  state.weekLoad = 0;
  state.weekEventsUsed = [];
  state._yesterday = null;
  renderHeader();
  renderWeek();
  try {
    for (let d = 1; d <= 7; d++) {
      await resolveDayCore(d, eventChoiceUI);
      renderHeader();
      renderWeek();
      renderAthlete();
      await sleep(280);
    }
  } catch (err) {
    state.running = false;
    console.error(err);
    toast('出了点问题，已中止本周');
    renderAll();
    return;
  }
  const summary = weekWrapUp();
  renderAll();
  await bodyCheckUI(summary);
  await reviewModal(summary);
}

let currentTab = 'week';
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  ['week', 'athlete', 'kb', 'history'].forEach(t => {
    $('#tab-' + t).classList.toggle('hidden', t !== tab);
  });
  if (tab === 'athlete') requestAnimationFrame(renderChart);
}

function renderAll() {
  renderHeader();
  renderWeek();
  renderAthlete();
  renderKb();
  renderHistory();
}

function init() {
  state = loadState() || defaultState();
  document.querySelectorAll('#tabs button').forEach(b => {
    b.onclick = () => switchTab(b.dataset.tab);
  });
  $('#btn-start').onclick = runWeekUI;
  $('#btn-recommend').onclick = recommendPlan;
  $('#btn-race').onclick = () => {
    if (state.lastSummary) reviewModal(state.lastSummary);
  };
  $('#btn-new').onclick = () => {
    if (!confirm('重新开档？当前进度将清空（知识图鉴保留）。')) return;
    state = defaultState();
    save();
    renderAll();
    switchTab('week');
    toast('已新开一档，加油！');
  };
  renderAll();
  if (state.week > 1) toast(`欢迎回来：第 ${state.week} 周 · ${STAGES[state.stage].title}`);
}

function planForStrategy(strategy, stage) {
  if (strategy === 'hard') {
    const seq = ['easyRun', 'strengthBody', 'tempo', 'longRun', 'interval', 'strengthBarbell', 'core'];
    return seq.map(id => TRAINING_BY_ID[id].minStage <= stage ? id : 'easyRun');
  }
  let plan = (PLANS[Math.min(stage, 4)] || PLANS[0]).slice();
  const a = state.athlete;
  if (a.injury) plan = plan.map(id => TRAINING_BY_ID[id].load > 15 ? 'rest' : id);
  if (a.fatigue > 65) plan = plan.map(id => TRAINING_BY_ID[id].load >= 26 ? 'stretch' : id);
  return plan;
}

function autoChoice(ev, strategy) {
  if (strategy === 'hard') return 0;
  const correctIdx = ev.options.findIndex(o => o.correct);
  if (correctIdx >= 0) return correctIdx;
  let best = Infinity, bi = 0;
  ev.options.forEach((o, i) => {
    const fx = o.fx || {};
    const gain = (fx.endurance || 0) + (fx.speed || 0) + (fx.strength || 0)
      + (fx.technique || 0) + (fx.flexibility || 0);
    const score = (fx.fatigue || 0) + (o.risk || 0) * 100 - (fx.mood || 0) * 0.5 - gain;
    if (score < best) { best = score; bi = i; }
  });
  return bi;
}

// 控制台平衡性自测：__debug(40, 'smart') / __debug(20, 'hard')
async function __debug(weeks = 40, strategy = 'smart', verbose = true) {
  const backup = state;
  state = defaultState();
  state.unlockedKnowledge = [];
  const res = { strategy, weeksRun: 0, injuries: 0, severe: 0, races: [], finalStage: '', maxFatigue: 0, maxAcwr: 0 };
  let wasInjured = false;
  for (let w = 1; w <= weeks && state.stage < STAGES.length - 1; w++) {
    state.weekPlan = planForStrategy(strategy, state.stage);
    state.running = true;
    state.weekLog = [];
    state.weekLoad = 0;
    state.weekEventsUsed = [];
    state._yesterday = null;
    for (let d = 1; d <= 7; d++) {
      await resolveDayCore(d, ev => autoChoice(ev, strategy));
      res.maxFatigue = Math.max(res.maxFatigue, state.athlete.fatigue);
      res.maxAcwr = Math.max(res.maxAcwr, state.weekLoad / chronicLoad());
      const inj = !!state.athlete.injury;
      if (inj && !wasInjured) { res.injuries++; if (state.athlete.injury.severe) res.severe++; }
      wasInjured = inj;
    }
    const summary = weekWrapUp();
    res.weeksRun = w;
    const race = STAGES[state.stage].race;
    if (race && raceNeedsOk() && !state.athlete.injury && state.athlete.fatigue < 45) {
      const sim = simulateRace();
      res.races.push({
        week: w, label: race.label, time: fmtTime(sim.total),
        target: fmtTime(race.target), pass: sim.pass, taper: sim.taper,
      });
      if (sim.pass) applyStageUp();
    }
    void summary;
  }
  res.finalStage = STAGES[state.stage].title;
  res.finalAttrs = Object.fromEntries(
    ['endurance', 'speed', 'strength', 'flexibility', 'technique', 'fatigue', 'mood', 'weight']
      .map(k => [k, Number(state.athlete[k].toFixed(1))]));
  state = backup;
  if (verbose) console.log('[领跑人生 debug]', JSON.stringify(res, null, 2));
  return res;
}

if (typeof window !== 'undefined') window.__debug = __debug;
if (typeof document !== 'undefined') init();
